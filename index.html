<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casos Clínicos — Fisiologia Renal</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --blue:#1d4ed8;--blue-light:#eff6ff;--blue-mid:#bfdbfe;
    --green:#15803d;--green-light:#f0fdf4;--green-mid:#bbf7d0;
    --red:#b91c1c;--red-light:#fef2f2;--red-mid:#fecaca;
    --amber:#92400e;--amber-light:#fffbeb;--amber-mid:#fde68a;
    --slate:#334155;--slate-light:#f8fafc;--slate-mid:#e2e8f0;
    --text:#0f172a;--sub:#64748b;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 40px}

  /* ── TOP BAR ── */
  .topbar{width:100%;max-width:800px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .topbar-title{display:flex;align-items:center;gap:10px}
  .topbar-title .icon{width:36px;height:36px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .topbar-title h1{font-size:.95rem;font-weight:700;color:var(--blue);line-height:1.3}
  .topbar-title p{font-size:.72rem;color:var(--sub)}
  .score-pill{background:#fff;border:1.5px solid var(--slate-mid);border-radius:99px;padding:5px 14px;font-size:.82rem;font-weight:600;color:var(--slate);white-space:nowrap}

  /* ── PROGRESS ── */
  .prog-wrap{width:100%;max-width:800px;margin-bottom:18px}
  .prog-top{display:flex;justify-content:space-between;font-size:.72rem;color:var(--sub);margin-bottom:5px}
  .prog-bar-bg{background:var(--slate-mid);border-radius:99px;height:7px}
  .prog-bar{height:7px;border-radius:99px;background:linear-gradient(90deg,#3b82f6,#1d4ed8);transition:width .45s ease}

  /* ── CARD ── */
  .card{width:100%;max-width:800px;background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,.08);overflow:hidden}

  /* card header */
  .card-header{background:linear-gradient(135deg,#1e3a5f 0%,#1d4ed8 100%);padding:18px 24px;display:flex;align-items:flex-start;gap:14px}
  .q-number{background:rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:6px 12px;font-size:.8rem;font-weight:700;white-space:nowrap;letter-spacing:.03em}
  .card-header-meta{flex:1}
  .card-header-meta .domain{font-size:.7rem;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
  .card-header-meta .level-badge{display:inline-block;background:rgba(255,255,255,.15);color:#fff;border-radius:99px;padding:2px 10px;font-size:.7rem;font-weight:700}

  /* vinheta */
  .vinheta-wrap{padding:20px 24px 0}
  .section-label{font-size:.65rem;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px;display:flex;align-items:center;gap:5px}
  .section-label::before{content:'';display:block;width:3px;height:12px;background:var(--blue);border-radius:99px}
  .vinheta-text{font-size:.9rem;color:var(--slate);line-height:1.7;margin-bottom:14px}

  /* lab table */
  .lab-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:14px;border-radius:8px;overflow:hidden;border:1px solid var(--slate-mid)}
  .lab-table thead{background:var(--slate-light)}
  .lab-table th{text-align:left;padding:7px 12px;font-size:.7rem;font-weight:700;color:var(--sub);letter-spacing:.06em;text-transform:uppercase}
  .lab-table td{padding:7px 12px;border-top:1px solid var(--slate-mid);color:var(--slate)}
  .lab-table td:nth-child(2){font-weight:700;color:var(--text)}
  .lab-table tr:nth-child(even){background:var(--slate-light)}

  /* question text */
  .question-box{margin:0 24px 20px;padding:14px 16px;background:var(--blue-light);border:1.5px solid var(--blue-mid);border-radius:10px}
  .question-box p{font-size:.95rem;font-weight:600;color:#1e3a5f;line-height:1.5}

  /* options */
  .options{padding:0 24px 22px;display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border:2px solid var(--slate-mid);border-radius:10px;cursor:pointer;font-size:.9rem;line-height:1.5;transition:border-color .15s,background .15s;user-select:none;background:#fff}
  .opt:hover:not(.disabled){border-color:#93c5fd;background:var(--blue-light)}
  .opt .letter{flex-shrink:0;width:28px;height:28px;border-radius:8px;background:var(--slate-light);color:var(--slate);font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:background .15s,color .15s;border:1.5px solid var(--slate-mid)}
  .opt.correct{border-color:#4ade80;background:var(--green-light)}
  .opt.correct .letter{background:#16a34a;color:#fff;border-color:#16a34a}
  .opt.wrong{border-color:#f87171;background:var(--red-light)}
  .opt.wrong .letter{background:#dc2626;color:#fff;border-color:#dc2626}
  .opt.disabled{cursor:default}
  .opt.neutral{opacity:.55}

  /* ── EXPLANATION PANEL ── */
  .exp-panel{display:none;border-top:2px solid var(--slate-mid);padding:22px 24px;background:var(--slate-light)}
  .exp-panel.show{display:block}

  .exp-correct-card{background:var(--green-light);border:1.5px solid var(--green-mid);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .exp-correct-card .exp-tag{font-size:.68rem;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .exp-correct-card p{font-size:.88rem;line-height:1.68;color:#14532d}
  .exp-source{font-size:.73rem;color:#166534;margin-top:7px;font-style:italic;opacity:.8}

  .logic-card{background:var(--amber-light);border:1.5px solid var(--amber-mid);border-radius:12px;padding:13px 16px;margin-bottom:16px}
  .logic-card .logic-tag{font-size:.68rem;font-weight:800;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .logic-card p{font-size:.85rem;line-height:1.6;color:var(--amber)}

  .dist-header{font-size:.68rem;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .dist-list{display:flex;flex-direction:column;gap:8px}
  .dist-item{background:#fff;border:1.5px solid var(--red-mid);border-radius:10px;padding:11px 14px}
  .dist-item .dist-tag{font-size:.68rem;font-weight:800;color:var(--red);display:block;margin-bottom:3px}
  .dist-item p{font-size:.85rem;line-height:1.55;color:#7f1d1d}
  .dist-item .dist-source{font-size:.7rem;color:#9f1717;margin-top:4px;font-style:italic;opacity:.75}

  /* ── BOTTOM BAR ── */
  .bottom-bar{width:100%;max-width:800px;display:flex;justify-content:flex-end;margin-top:14px}
  .btn-next{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:10px;padding:11px 28px;font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .15s;display:none;box-shadow:0 2px 8px rgba(29,78,216,.3)}
  .btn-next:hover{opacity:.88}

  /* ── FINISH ── */
  .finish{display:none;width:100%;max-width:800px;background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,.08);overflow:hidden}
  .finish-header{background:linear-gradient(135deg,#1e3a5f,#1d4ed8);padding:36px 28px;text-align:center;color:#fff}
  .finish-header h2{font-size:1.4rem;font-weight:800;margin-bottom:6px}
  .finish-header p{font-size:.85rem;opacity:.8}
  .finish-body{padding:30px 28px;text-align:center}
  .finish-score{font-size:3.5rem;font-weight:900;color:var(--blue);line-height:1}
  .finish-pct{font-size:1rem;color:var(--sub);margin:6px 0 14px}
  .finish-msg{font-size:.9rem;color:var(--slate);background:var(--slate-light);border-radius:10px;padding:12px 18px;margin-bottom:22px}
  .btn-restart{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:10px;padding:12px 32px;font-size:.95rem;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(29,78,216,.3)}
  .btn-restart:hover{opacity:.88}

  @media(max-width:500px){
    .card-header{padding:14px 16px}
    .vinheta-wrap{padding:16px 16px 0}
    .question-box{margin:0 16px 16px}
    .options{padding:0 16px 18px}
    .exp-panel{padding:18px 16px}
    .finish-body{padding:22px 16px}
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title">
    <div class="icon">🫘</div>
    <div>
      <h1>Casos Clínicos — Fisiologia Renal</h1>
      <p>Costanzo Fisiologia, 5.ª Edição — Capítulo 6</p>
    </div>
  </div>
  <div class="score-pill" id="scorePill">0 / 0</div>
</div>

<!-- PROGRESS -->
<div class="prog-wrap">
  <div class="prog-top">
    <span id="progLabel">Questão 1 de 20</span>
    <span id="progPct">0%</span>
  </div>
  <div class="prog-bar-bg"><div class="prog-bar" id="progBar" style="width:0%"></div></div>
</div>

<!-- QUIZ CARD -->
<div class="card" id="quizCard">
  <div class="card-header">
    <div class="q-number" id="qNum">Q1 / 20</div>
    <div class="card-header-meta">
      <div class="domain" id="qDomain"></div>
      <span class="level-badge" id="qLevel"></span>
    </div>
  </div>

  <div class="vinheta-wrap">
    <div class="section-label">Vinheta Clínica</div>
    <div class="vinheta-text" id="vinheta"></div>
    <div id="labTableWrap"></div>
  </div>

  <div class="question-box"><p id="questionText"></p></div>

  <div class="options" id="optionsContainer"></div>

  <div class="exp-panel" id="expPanel">
    <div class="exp-correct-card">
      <div class="exp-tag">✅ Resposta Correcta</div>
      <p id="expCorrectText"></p>
      <p class="exp-source" id="expSource"></p>
    </div>
    <div class="logic-card">
      <div class="logic-tag">🔗 Raciocínio</div>
      <p id="logicText"></p>
    </div>
    <div class="dist-header">❌ Distratores</div>
    <div class="dist-list" id="distList"></div>
  </div>
</div>

<!-- BOTTOM -->
<div class="bottom-bar">
  <button class="btn-next" id="btnNext" onclick="nextQ()">Próximo Caso →</button>
</div>

<!-- FINISH -->
<div class="finish" id="finishCard">
  <div class="finish-header">
    <h2>Casos Clínicos Concluídos 🎉</h2>
    <p>Costanzo Fisiologia — Capítulo 6: Fisiologia Renal</p>
  </div>
  <div class="finish-body">
    <div class="finish-score" id="finScore"></div>
    <div class="finish-pct" id="finPct"></div>
    <div class="finish-msg" id="finMsg"></div>
    <button class="btn-restart" onclick="restart()">Recomeçar</button>
  </div>
</div>

<script>
const Qs = [
  {
    n:1, level:"L1", domain:"Fisiologia Renal",
    vinheta:"Um homem de 48 anos é admitido no serviço de urgência após referir cefaleia intensa de início súbito. Não tem antecedentes pessoais de relevo e não faz medicação habitual. À avaliação inicial, a pressão arterial é de 160 mmHg (sistólica), registando-se um aumento súbito relativamente ao valor basal habitual de 100 mmHg. Apesar desta subida pressórica, os estudos de função renal realizados à admissão mostram que o fluxo sanguíneo renal (FSR) e a taxa de filtração glomerular (TFG) se mantêm dentro dos valores normais.",
    lab:null,
    question:"Qual dos seguintes mecanismos explica melhor a manutenção do FSR e da TFG dentro dos valores normais apesar do aumento súbito da pressão arterial?",
    opts:[
      {l:"A",t:"Vasodilatação da arteríola eferente mediada pelo sistema nervoso simpático"},
      {l:"B",t:"Vasoconstrição da arteríola eferente pela angiotensina II"},
      {l:"C",t:"Constrição reflexa da arteríola aferente induzida pelo estiramento (mecanismo miogénico)"},
      {l:"D",t:"Constrição da arteríola aferente pela mácula densa em resposta ao aumento do aporte de soluto tubular"},
      {l:"E",t:"Dilatação das arteríolas aferente e eferente pelas prostaglandinas renais"}
    ],
    correct:"D",
    exp:"O feedback tubuloglomerular é um mecanismo de autorregulação no qual um aumento da TFG eleva o aporte de NaCl à mácula densa (trecho inicial do túbulo distal). A mácula densa, como parte do aparelho justaglomerular, liberta substâncias vasoactivas (adenosina, ATP, tromboxanos) que actuam localmente sobre a arteríola aferente, promovendo a sua constrição. O aumento de resistência reduz o FSR e a TFG, corrigindo o desvio inicial. O sistema nervoso autónomo não está envolvido — rins transplantados (desnervados) autorregulam-se igualmente bem.",
    source:"Cap. 6 — Feedback tubuloglomerular",
    logic:"PA ↑ → FSR e TFG ↑ transitoriamente → mais NaCl à mácula densa → substância vasoactiva libertada → constrição aferente → resistência ↑ → FSR e TFG normalizam.",
    distractors:[
      {l:"A",t:"A vasodilatação eferente reduziria a TFG (não a normalizaria); além disso, o simpático causa vasoconstrição, não vasodilatação.",src:"Cap. 6 — Regulação do FSR"},
      {l:"B",t:"A angiotensina II em baixas concentrações constringe preferencialmente a eferente, o que aumentaria a TFG — agravando o desvio.",src:"Cap. 6 — Angiotensina II"},
      {l:"C",t:"O mecanismo miogénico também contribui para a autorregulação, mas a questão descreve especificamente a detecção do aporte de soluto pela mácula densa.",src:"Cap. 6 — Hipótese miogénica"},
      {l:"E",t:"As prostaglandinas renais (PGE₂, PGI₂) são vasodilatadoras com papel protector em vasoconstrição excessiva; não são o mecanismo principal de autorregulação.",src:"Cap. 6 — Prostaglandinas"}
    ]
  },
  {
    n:2, level:"L2", domain:"Fisiologia Renal",
    vinheta:"Um homem de 35 anos é trazido ao serviço de urgência após traumatismo abdominal por acidente de viação. Apresenta-se agitado e pálido. Os sinais vitais são: FC 118/min, PA 82/54 mmHg, FR 24/min, T 36,2 ºC. O exame abdominal revela dor difusa e sinais de irritação peritoneal. É diagnosticado choque hemorrágico com activação marcada do sistema renina-angiotensina-aldosterona; os níveis plasmáticos de angiotensina II encontram-se marcadamente elevados.",
    lab:null,
    question:"Qual dos seguintes pares de alterações melhor descreve o efeito esperado dos níveis elevados de angiotensina II sobre o fluxo plasmático renal (FPR) e a taxa de filtração glomerular (TFG)?",
    opts:[
      {l:"A",t:"FPR diminui; TFG aumenta"},
      {l:"B",t:"FPR aumenta; TFG aumenta"},
      {l:"C",t:"FPR diminui; TFG diminui"},
      {l:"D",t:"FPR diminui; TFG não se altera"},
      {l:"E",t:"FPR não se altera; TFG diminui"}
    ],
    correct:"C",
    exp:"Em níveis elevados de angiotensina II (como na hemorragia), o vasoconstritor actua nas arteríolas aferente e eferente. Com concentrações altas, o efeito constritor sobre a arteríola aferente é pronunciado o suficiente para reduzir a pressão hidrostática no capilar glomerular (PCG) e, consequentemente, a TFG. O FPR diminui porque ambas as arteríolas contraem, aumentando a resistência total. Assim, tanto o FPR como a TFG diminuem.",
    source:"Cap. 6 — Angiotensina II / Regulação do FSR",
    logic:"Hemorragia → SRAA activado → angiotensina II ↑↑ → constrição aferente + eferente (predominância aferente a altas doses) → PCG ↓ → TFG ↓; resistência total ↑ → FPR ↓.",
    distractors:[
      {l:"A",t:"TFG aumenta apenas com baixos níveis de angiotensina II (constrição preferencial da eferente); com níveis altos, a TFG diminui.",src:"Cap. 6 — Angiotensina II"},
      {l:"B",t:"A angiotensina II é sempre vasoconstritora; o FPR nunca aumenta com a sua acção.",src:"Cap. 6 — Regulação do FSR"},
      {l:"D",t:"A TFG mantém-se inalterada só se os efeitos aferente e eferente se equilibrarem exactamente; a níveis elevados, a redução aferente predomina.",src:"Cap. 6 — Tabela 6-6"},
      {l:"E",t:"A constrição de ambas as arteríolas aumenta a resistência total, reduzindo sempre o FPR.",src:"Cap. 6 — Regulação do FSR"}
    ]
  },
  {
    n:3, level:"L1", domain:"Fisiologia Renal",
    vinheta:"Um investigador de fisiologia renal pretende medir com rigor a taxa de filtração glomerular (TFG) num voluntário saudável do sexo masculino, com 28 anos. Para o efeito, é planeada a infusão endovenosa de uma substância exógena que permita calcular a TFG a partir da respectiva depuração renal.",
    lab:null,
    question:"Qual das seguintes substâncias é o marcador glomerular ideal para determinar a TFG?",
    opts:[
      {l:"A",t:"Albumina"},
      {l:"B",t:"Creatinina"},
      {l:"C",t:"PAH (ácido para-amino-hipúrico)"},
      {l:"D",t:"Ureia"},
      {l:"E",t:"Inulina"}
    ],
    correct:"E",
    exp:"A inulina é o único marcador glomerular perfeito porque: (1) é filtrada livremente pelos capilares glomerulares, sem restrições de tamanho ou carga; (2) não é reabsorvida nem secretada pelo túbulo renal; (3) quando infundida, não altera a TFG. Estas três propriedades garantem que toda a inulina filtrada seja excretada, tornando a sua depuração exactamente igual à TFG (120 mL/min em condições normais).",
    source:"Cap. 6 — Determinação da TFG / Depuração da Inulina",
    logic:"Marcador ideal = filtração livre + sem reabsorção + sem secreção → D(marcador) = TFG. Só a inulina cumpre as 3 condições.",
    distractors:[
      {l:"A",t:"A albumina não é filtrada (grande dimensão e carga negativa); a sua depuração é próxima de zero.",src:"Cap. 6 — Depuração de Várias Substâncias"},
      {l:"B",t:"A creatinina é filtrada mas também secretada em pequenas quantidades, pelo que a sua depuração sobrestima ligeiramente a TFG. Usada por conveniência clínica, não como padrão.",src:"Cap. 6 — Outros Marcadores de TFG"},
      {l:"C",t:"O PAH é filtrado e secretado; a sua depuração mede o fluxo plasmático renal efetivo (FPRe), não a TFG.",src:"Cap. 6 — PAH — Exemplo de Secreção"},
      {l:"D",t:"A ureia é filtrada e parcialmente reabsorvida no túbulo proximal; a sua depuração subestima a TFG.",src:"Cap. 6 — Ureia — Reabsorção Passiva"}
    ]
  },
  {
    n:4, level:"L2", domain:"Fisiologia Renal / Patologia",
    vinheta:"Uma mulher de 72 anos é trazida ao serviço de urgência por vómitos persistentes com três dias de evolução, sem conseguir manter qualquer ingestão oral. Os sinais vitais são: FC 102/min, PA 98/64 mmHg, T 36,8 ºC, SpO₂ 97%. O exame físico revela mucosas secas, turgência cutânea diminuída e ausência de edemas. Os resultados analíticos são os seguintes:",
    lab:[
      {param:"BUN",val:"56 mg/dL",ref:"N: 7–20"},
      {param:"Creatinina sérica",val:"2,0 mg/dL",ref:"N: 0,6–1,2"},
      {param:"Relação BUN/creatinina",val:"28",ref:"N: 10–20"}
    ],
    question:"Qual dos seguintes mecanismos é responsável pelo valor elevado da relação BUN/creatinina nesta doente?",
    opts:[
      {l:"A",t:"A creatinina é secretada pelos túbulos, diluindo a sua concentração sérica"},
      {l:"B",t:"A ureia é secretada pelos túbulos, elevando a concentração sérica"},
      {l:"C",t:"A reabsorção tubular de ureia está aumentada, enquanto a creatinina não é reabsorvida"},
      {l:"D",t:"A TFG aumenta selectivamente a filtração de ureia em relação à creatinina"},
      {l:"E",t:"A creatinina é metabolizada pelos túbulos renais, reduzindo o seu nível sérico"}
    ],
    correct:"C",
    exp:"Na contracção de volume (azotemia pré-renal), a redução do FSR reduz a TFG, aumentando ambas BUN e creatinina sérica. Contudo, como a ureia é reabsorvida no túbulo proximal (junto com Na⁺ e outros solutos) e a creatinina não é reabsorvida, o BUN sobe desproporcionalmente. Relação BUN/creatinina > 20 é indicador de azotemia pré-renal.",
    source:"Cap. 6 — Outros Marcadores de TFG / BUN e creatinina sérica",
    logic:"Contracção de volume → TFG ↓ → BUN ↑ e creatinina ↑. Mas: ureia reabsorvida no proximal (↑↑ com contracção) + creatinina não reabsorvida → BUN sobe mais → BUN/creatinina > 20 → azotemia pré-renal.",
    distractors:[
      {l:"A",t:"A creatinina é levemente secretada (não reabsorvida), o que tenderia a aumentar a sua excreção urinária, não a diluir a concentração sérica.",src:"Cap. 6 — Outros Marcadores de TFG"},
      {l:"B",t:"A ureia é reabsorvida, não secretada. A secreção aumentaria a excreção urinária, não a sérica.",src:"Cap. 6 — Ureia — Reabsorção Passiva"},
      {l:"D",t:"A filtração glomerular não distingue selectivamente entre ureia e creatinina; ambas são filtradas livremente.",src:"Cap. 6 — Determinação da TFG"},
      {l:"E",t:"Os túbulos renais não metabolizam a creatinina; é um produto metabólico estável do músculo.",src:"Cap. 6 — Outros Marcadores de TFG"}
    ]
  },
  {
    n:5, level:"L2", domain:"Fisiologia Renal",
    vinheta:"Num modelo experimental de fisiologia renal, baixas concentrações de angiotensina II são administradas por perfusão intra-arterial renal de forma a actuar selectivamente na arteríola eferente, aumentando a sua resistência vascular, sem efeito relevante sobre a arteríola aferente.",
    lab:null,
    question:"Qual dos seguintes pares de alterações descreve correctamente o efeito esperado sobre o fluxo plasmático renal (FPR) e a taxa de filtração glomerular (TFG)?",
    opts:[
      {l:"A",t:"FPR aumenta; TFG aumenta"},
      {l:"B",t:"FPR diminui; TFG diminui"},
      {l:"C",t:"FPR não se altera; TFG aumenta"},
      {l:"D",t:"FPR diminui; TFG aumenta"},
      {l:"E",t:"FPR aumenta; TFG não se altera"}

let cur=0, answered=false, score=0;

function buildLabTable(rows){
  if(!rows||!rows.length) return '';
  let h=`<table class="lab-table"><thead><tr><th>Parâmetro</th><th>Valor</th><th>Referência</th></tr></thead><tbody>`;
  rows.forEach(r=>{ h+=`<tr><td>${r.param}</td><td>${r.val}</td><td>${r.ref}</td></tr>`; });
  return h+`</tbody></table>`;
}

function render(){
  const q=Qs[cur]; answered=false;
  const pct=Math.round((cur/Qs.length)*100);
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progLabel').textContent=`Questão ${cur+1} de ${Qs.length}`;
  document.getElementById('progPct').textContent=pct+'%';
  document.getElementById('scorePill').textContent=`${score} / ${cur}`;
  document.getElementById('qNum').textContent=`Caso ${q.n} / ${Qs.length}`;
  document.getElementById('qDomain').textContent=q.domain;
  document.getElementById('qLevel').textContent=q.level;
  document.getElementById('vinheta').textContent=q.vinheta;
  document.getElementById('labTableWrap').innerHTML=buildLabTable(q.lab);
  document.getElementById('questionText').textContent=q.question;

  const oc=document.getElementById('optionsContainer');
  oc.innerHTML='';
  q.opts.forEach(o=>{
    const d=document.createElement('div');
    d.className='opt'; d.dataset.l=o.l;
    d.innerHTML=`<span class="letter">${o.l}</span><span>${o.t}</span>`;
    d.addEventListener('click',()=>pick(o.l));
    oc.appendChild(d);
  });

  document.getElementById('expPanel').classList.remove('show');
  document.getElementById('btnNext').style.display='none';
}

function pick(chosen){
  if(answered) return;
  answered=true;
  const q=Qs[cur];
  const ok=chosen===q.correct;
  if(ok) score++;

  document.querySelectorAll('.opt').forEach(el=>{
    el.classList.add('disabled');
    const l=el.dataset.l;
    if(l===q.correct) el.classList.add('correct');
    else if(l===chosen&&!ok) el.classList.add('wrong');
    else el.classList.add('neutral');
  });

  document.getElementById('expCorrectText').textContent=q.exp;
  document.getElementById('expSource').textContent='📚 Fonte: Costanzo Fisiologia — '+q.source;
  document.getElementById('logicText').textContent=q.logic;

  const dl=document.getElementById('distList');
  dl.innerHTML='';
  q.distractors.forEach(d=>{
    const div=document.createElement('div');
    div.className='dist-item';
    div.innerHTML=`<span class="dist-tag">${d.l}) Incorrecta</span><p>${d.t}</p><p class="dist-source">📚 ${d.src}</p>`;
    dl.appendChild(div);
  });

  document.getElementById('expPanel').classList.add('show');
  document.getElementById('scorePill').textContent=`${score} / ${cur+1}`;

  const btn=document.getElementById('btnNext');
  btn.style.display='block';
  btn.textContent=cur<Qs.length-1?'Próximo Caso →':'Ver Resultado Final';

  // scroll to explanation
  setTimeout(()=>document.getElementById('expPanel').scrollIntoView({behavior:'smooth',block:'nearest'}),120);
}

function nextQ(){
  cur++;
  if(cur>=Qs.length){showFinish();return;}
  document.getElementById('expPanel').classList.remove('show');
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showFinish(){
  document.getElementById('quizCard').style.display='none';
  document.getElementById('btnNext').style.display='none';
  document.getElementById('progBar').style.width='100%';
  document.getElementById('progPct').textContent='100%';
  document.getElementById('progLabel').textContent=`${Qs.length} de ${Qs.length} casos`;
  const pct=Math.round((score/Qs.length)*100);
  let msg='';
  if(pct>=85) msg='🏆 Excelente! Domínio sólido da Fisiologia Renal. Estás pronto para o exame.';
  else if(pct>=65) msg='👍 Bom resultado! Revê os casos onde erraste, focando nos distratores.';
  else msg='📖 Continua a estudar — volta ao Capítulo 6 do Costanzo e refaz os casos.';
  document.getElementById('finScore').textContent=`${score} / ${Qs.length}`;
  document.getElementById('finPct').textContent=`${pct}% de respostas correctas`;
  document.getElementById('finMsg').textContent=msg;
  document.getElementById('finishCard').style.display='block';
}

function restart(){
  cur=0; score=0;
  document.getElementById('finishCard').style.display='none';
  document.getElementById('quizCard').style.display='block';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
</body>
</html>
