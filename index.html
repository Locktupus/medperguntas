<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>VésperaQUIZ — NOVA Medical School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="topbar">
  <div class="topbar-logo">
    <span class="logo-v">Véspera</span><span class="logo-q">QUIZ</span>
    <span class="sep">|</span>
    <span class="sub">NOVA Medical School</span>
  </div>
</nav>

<div class="page">

  <div class="page-header">
    <div class="page-header-left">
      <h1><span class="logo-v" style="color:var(--text)">Véspera</span><span class="logo-q" style="color:var(--cobalt)">QUIZ</span></h1>
      <p>Banco de questões para a NOVA Medical School.</p>
    </div>
    <div class="page-header-stats" id="pageStats"></div>
  </div>

  <div class="section-label" id="permanentLabel">Quizzes Disponíveis</div>
  <div class="quiz-grid" id="quizGrid">
    <div class="empty-state">
      <div class="icon">⏳</div>
      <p>A carregar…</p>
    </div>
  </div>

  <div class="import-section">
    <div class="section-label">Importar Quiz</div>
    <div id="dropZone" class="import-zone">
      <div class="iz-icon">📂</div>
      <h3>Importar ficheiro JSON</h3>
      <p>Arrasta um ficheiro <strong>.json</strong> para aqui,<br>ou clica para escolher do dispositivo.</p>
      <button class="btn-import" onclick="document.getElementById('fileInput').click()">
        Escolher ficheiro
      </button>
      <input type="file" id="fileInput" accept=".json,application/json">
    </div>
    <div id="importedCard" style="display:none"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const LOCAL_KEY       = 'mq_imported_bank';
const PROGRESS_PREFIX = 'mq_progress_';

const TYPE_LABELS = {
  clinical:   { label: 'Casos Clínicos',   cls: 'tag-clinical'  },
  questions:  { label: 'Questões',          cls: 'tag-questions' },
  exam:       { label: 'Exames',            cls: 'tag-exam'      },
  test:       { label: 'Testes',            cls: 'tag-test'      },
  mcq:        { label: 'Escolha Múltipla',  cls: 'tag-mcq'       },
  practical:  { label: 'Casos Práticos',    cls: 'tag-practical' },
  mixed:      { label: 'Banco Misto',       cls: 'tag-mixed'     },
  general:    { label: 'Banco Geral',       cls: 'tag-gen'       }  /* legacy */
};

function shadeColor(hex, pct) {
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, Math.max(0, (n >> 16) + pct));
  const g = Math.min(255, Math.max(0, ((n >> 8) & 0xff) + pct));
  const b = Math.min(255, Math.max(0, (n & 0xff) + pct));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

function hexToRgba(hex, alpha) {
  const n = parseInt(hex.replace('#',''), 16);
  return `rgba(${(n>>16)&0xff},${(n>>8)&0xff},${n&0xff},${alpha})`;
}

let toastTimer;
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (isError ? ' error' : '');
  clearTimeout(toastTimer); void t.offsetWidth; t.classList.add('show');
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

function getProgress(bankId) {
  try { const r = localStorage.getItem(PROGRESS_PREFIX + bankId); return r ? JSON.parse(r) : null; }
  catch (_) { return null; }
}
function clearProgress(bankId) { localStorage.removeItem(PROGRESS_PREFIX + bankId); }

/* ── Card builder ── */
function buildResCard({ color, label, labelColor, icon, title, subtitle,
                        progress, totalQ, onContinue, btnContinueText, onFresh, onReplace }) {
  const hasProgress = progress && progress.cur > 0;
  const btnGlow     = hexToRgba(color, 0.28);

  let statsHtml = '';
  if (hasProgress) {
    const done     = progress.cur;
    const pctDone  = Math.round((done / totalQ) * 100);
    const pctRight = done > 0 ? Math.round((progress.score / done) * 100) : 0;
    statsHtml = `
      <div class="res-card-stats">
        <span>${done}/${totalQ} questões</span>
        <span class="res-stat-right">✓ ${progress.score}</span>
        <span class="res-stat-wrong">✗ ${progress.wrong}</span>
        <span>${pctRight}% certas</span>
      </div>
      <div class="res-card-prog-wrap">
        <div class="res-card-prog-fill" style="width:${pctDone}%;background:${color}"></div>
      </div>`;
  }

  const replaceBtn = onReplace
    ? `<button class="btn-start-fresh" onclick="${onReplace}">↩ Outro ficheiro</button>` : '';
  const resetBtn = onFresh
    ? `<button class="btn-icon-reset" onclick="${onFresh}" title="Recomeçar" aria-label="Recomeçar">↺</button>` : '';

  return `
    <div class="res-card" style="--card-color:${color}">
      <div class="res-card-tint"></div>
      <span class="res-card-motif" aria-hidden="true">${icon}</span>
      <div class="res-card-banner" style="background:${color}"></div>
      <div class="res-card-body">
        <div class="res-card-label">
          <span class="res-card-icon">${icon}</span>
          <span style="color:${labelColor || color}">${label}</span>
        </div>
        <div class="res-card-title">${title}</div>
        <div class="res-card-sub">${subtitle}</div>
        <div class="res-card-bottom">
          ${statsHtml}
          <div class="res-card-btns">
            <div class="res-card-btns-left">
              <button class="btn-continue"
                style="background:${color};--btn-glow:${btnGlow}"
                onclick="${onContinue}">${btnContinueText}</button>
              ${replaceBtn}
            </div>
            <div class="res-card-btns-right">${resetBtn}</div>
          </div>
        </div>
      </div>
    </div>`;
}

/* ── Permanent quizzes ── */
const _permBanks = [];

async function loadPermanent() {
  const grid = document.getElementById('quizGrid');
  let banks = [];
  try {
    const res = await fetch('data/index.json');
    if (res.ok) {
      const data = await res.json();
      banks = data.quizzes || data;   /* new object format or legacy flat array */
    }
  } catch (_) {}

  if (!banks.length) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>Nenhum quiz encontrado.</p></div>`;
    document.getElementById('permanentLabel').style.display = 'none';
    return;
  }

  _permBanks.length = 0;
  banks.forEach(b => _permBanks.push(b));
  grid.innerHTML = '';

  banks.forEach((b, i) => {
    const wrapper = document.createElement('div');
    wrapper.style.setProperty('--i', i);   /* stagger delay */
    wrapper.id = `card_${CSS.escape(b.file)}`;
    wrapper.appendChild(makePermCard(b));
    grid.appendChild(wrapper);
  });

  const totalQ = banks.reduce((s, b) => s + (b.questionCount || 0), 0);
  document.getElementById('pageStats').innerHTML = `
    <div class="stat-block">
      <span class="num">${banks.length}</span>
      <span class="label">Quizzes</span>
    </div>
    <div class="stat-block">
      <span class="num">${totalQ}</span>
      <span class="label">Questões</span>
    </div>`;
}

function makePermCard(bank) {
  const ti          = TYPE_LABELS[bank.type] || { label: bank.type, cls: 'tag-gen' };
  const lvl         = (bank.levels || []).map(l => `<span class="tag tag-l">${l}</span>`).join('');
  const color       = bank.color || '#1548E8';
  const progress    = getProgress(bank.file);
  const hasProgress = progress && progress.cur > 0 && progress.cur < (bank.questionCount || 999);
  const fileEsc     = bank.file.replace(/'/g, "\\'");
  const el          = document.createElement('div');

  if (hasProgress) {
    el.innerHTML = buildResCard({
      color, label: '● Em progresso', labelColor: color,
      icon: bank.icon || '📋', title: bank.title, subtitle: bank.subtitle || '',
      progress, totalQ: bank.questionCount || progress.cur,
      onContinue: `goToQuiz('${fileEsc}')`, btnContinueText: '▶ Continuar',
      onFresh: `freshStart(event,'${fileEsc}')`
    });
  } else {
    el.innerHTML = buildResCard({
      color, label: 'Disponível',
      icon: bank.icon || '📋', title: bank.title, subtitle: bank.subtitle || '',
      progress: null, totalQ: bank.questionCount || 0,
      onContinue: `goToQuiz('${fileEsc}')`, btnContinueText: '▶ Iniciar quiz',
      onFresh: null
    });
    el.querySelector('.res-card-sub').insertAdjacentHTML('afterend',
      `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">
        <span class="tag ${ti.cls}">${ti.label}</span>
        <span class="tag tag-q">${bank.questionCount} questões</span>
        ${lvl}
       </div>`);
  }
  return el;
}

function goToQuiz(file) { window.location.href = `quiz.html?bank=${encodeURIComponent(file)}`; }

function freshStart(event, file) {
  event.stopPropagation();
  clearProgress(file);
  const bank    = _permBanks.find(b => b.file === file);
  if (!bank) return;
  const wrapper = document.getElementById(`card_${CSS.escape(file)}`);
  if (!wrapper) return;
  wrapper.innerHTML = '';
  wrapper.appendChild(makePermCard(bank));
}

/* ── Imported bank ── */
function checkImported() {
  const raw = localStorage.getItem(LOCAL_KEY);
  if (!raw) { showDropZone(); return; }
  let bank;
  try { bank = JSON.parse(raw); } catch (_) { showDropZone(); return; }
  const meta        = bank.meta || {};
  const color       = meta.color || '#1548E8';
  const progress    = getProgress('local');
  const total       = bank.questions?.length || 0;
  const hasProgress = progress && progress.cur > 0 && progress.cur < total;

  const importWrapper = document.getElementById('importedCard');
  importWrapper.style.setProperty('--i', 0);
  importWrapper.innerHTML = buildResCard({
    color, label: hasProgress ? '● Em progresso' : '● Importado', labelColor: color,
    icon: meta.icon || '📋', title: meta.title || 'Quiz importado', subtitle: meta.subtitle || '',
    progress: hasProgress ? progress : null, totalQ: total,
    onContinue: 'launchImported()', btnContinueText: hasProgress ? '▶ Continuar' : '▶ Iniciar quiz',
    onFresh: hasProgress ? 'freshStartImported(event)' : null, onReplace: 'replaceImported()'
  });
  document.getElementById('dropZone').style.display     = 'none';
  importWrapper.style.display = 'block';
}

function showDropZone() {
  document.getElementById('dropZone').style.display     = 'block';
  document.getElementById('importedCard').style.display = 'none';
}
function launchImported()     { window.location.href = 'quiz.html?bank=local'; }
function replaceImported()    { document.getElementById('fileInput').click(); }
function freshStartImported(e){ if (e) e.stopPropagation(); clearProgress('local'); checkImported(); }

/* ── File handling ── */
function handleFile(file) {
  if (!file || !file.name.endsWith('.json')) {
    showToast('❌ Ficheiro inválido — precisa de ser .json', true); return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    let bank;
    try { bank = JSON.parse(e.target.result); }
    catch (_) { showToast('❌ JSON inválido — verifica o ficheiro', true); return; }
    if (!bank.questions || !Array.isArray(bank.questions) || !bank.questions.length) {
      showToast('❌ Ficheiro sem questões válidas', true); return;
    }
    clearProgress('local');
    localStorage.setItem(LOCAL_KEY, e.target.result);
    showToast('✅ Ficheiro carregado!');
    setTimeout(() => { window.location.href = 'quiz.html?bank=local'; }, 600);
  };
  reader.readAsText(file);
}

const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); handleFile(e.dataTransfer.files[0]); });
document.getElementById('fileInput').addEventListener('change', e => { handleFile(e.target.files[0]); e.target.value = ''; });

loadPermanent();
checkImported();
</script>
</body>
</html>
