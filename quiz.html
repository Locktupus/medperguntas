<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>VésperaQUIZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="topbar">
  <div class="topbar-logo">
    <span class="logo-v">Véspera</span><span class="logo-q">QUIZ</span>
    <span class="sep">|</span>
    <span class="sub">NOVA Medical School</span>
  </div>
  <a class="topbar-back" href="index.html">← Início</a>
</nav>

<!-- Progress bar — single line -->
<div class="prog-wrap">
  <div class="prog-top">
    <span id="progLabel">A carregar…</span>
    <div class="prog-bar-wrap">
      <div class="prog-bg"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <span id="progPct">0%</span>
    <span class="prog-vdiv"></span>
    <div class="prog-inline-scores">
      <span class="prog-score right" id="cntRight">✓ 0</span>
      <span class="prog-score-sep"></span>
      <span class="prog-score wrong" id="cntWrong">✗ 0</span>
    </div>
  </div>
</div>

<!-- Seed sync -->
<div class="seed-wrap" id="seedWrap" style="display:none">
  <button class="btn-seed-toggle" id="seedToggle" onclick="toggleSeedPanel()">
    <i class="arrow">▾</i> Sincronizar sessão
  </button>
  <div class="seed-panel" id="seedPanel">
    <div class="seed-group">
      <span class="seed-label">A tua sessão:</span>
      <span class="seed-code" id="seedDisplay">–</span>
      <button class="btn-seed-copy" onclick="copyLink()">Copiar link</button>
    </div>
    <div class="seed-divider"></div>
    <div class="seed-group">
      <span class="seed-label">Entrar com seed:</span>
      <input class="seed-input" id="seedInput" type="text" placeholder="seed ou seed:questão" maxlength="25">
      <button class="btn-seed-join" onclick="joinSeed()">Ir</button>
    </div>
  </div>
</div>

<div class="page" style="padding-top:14px;padding-bottom:20px;">

  <!-- Quiz card -->
  <div class="qcard" id="qcard">
    <div class="qcard-header">
      <span class="q-num" id="qNum">–</span>
      <div class="qcard-meta">
        <span class="domain" id="qDomain"></span>
        <span class="level-badge" id="qLevel"></span>
      </div>
    </div>
    <div class="vignette-wrap" id="vignetteWrap" style="display:none">
      <div class="section-label-inline">Vinheta Clínica</div>
      <div class="vignette-text" id="vignetteText"></div>
      <div id="labTableWrap"></div>
    </div>
    <div class="question-box">
      <div class="q-label">Questão</div>
      <p id="questionText"></p>
    </div>
    <div class="options" id="optionsContainer"></div>
    <div class="exp-panel" id="expPanel">
      <div class="exp-correct">
        <div class="exp-tag">✓ Resposta Correcta</div>
        <p id="expText"></p>
        <p class="exp-source" id="expSource"></p>
      </div>
      <div class="logic-box" id="logicBox">
        <div class="logic-tag">Raciocínio</div>
        <p id="logicText"></p>
      </div>
      <div id="distSection">
        <div class="dist-header">Por que não as outras opções?</div>
        <div class="dist-list" id="distList"></div>
      </div>
    </div>
  </div>

  <!-- Navigation — two islands below quiz card -->
  <div class="qnav-area" id="qnavArea">
    <div class="qnav-islands">
      <!-- Left island: single row — ← strip → expand -->
      <div class="qnav-left-island">
        <button class="qnav-arrow-btn" id="qnavPrev" onclick="navPrev()" aria-label="Questão anterior">←</button>
        <div class="qnav-strip-wrap" id="qnavStripWrap">
          <div class="qnav-strip" id="qnavStrip"></div>
        </div>
        <button class="qnav-arrow-btn" id="qnavNext" onclick="navNext()" aria-label="Próxima questão">→</button>
        <button class="qnav-expand-btn" id="qnavExpandBtn" onclick="toggleNavMap()">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="0" y="0" width="5" height="5" rx="1"/>
            <rect x="7" y="0" width="5" height="5" rx="1"/>
            <rect x="0" y="7" width="5" height="5" rx="1"/>
            <rect x="7" y="7" width="5" height="5" rx="1"/>
          </svg>
          Expandir Questões <span class="qnav-chev" id="qnavChev">▾</span>
        </button>
      </div>
      <!-- Right island: action button -->
      <div class="qnav-right-island">
        <button class="btn-skip" id="btnSkip" onclick="navSkip()">Saltar</button>
        <button class="btn-next" id="btnNext" onclick="nextQuestion()">Próxima →</button>
      </div>
    </div>
    <!-- Full map expands below as a separate card -->
    <div class="qnav-full" id="qnavFull">
      <div class="qnav-full-grid" id="qnavFullGrid"></div>
      <div class="qnav-full-footer">
        <button class="qnav-end-btn" onclick="showFinishConfirm()">🏁 Terminar Quiz</button>
      </div>
    </div>
  </div>

  <!-- Finish screen -->
  <div class="finish" id="finishScreen">
    <div class="finish-header">
      <span class="fin-medal" id="finMedal">🥇</span>
      <div class="finish-score" id="finScore"></div>
      <p class="fin-title-text" id="finTitle"></p>
    </div>
    <div class="finish-body">
      <div class="fin-ring-wrap">
        <svg class="fin-ring" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <circle class="fin-ring-bg"      cx="60" cy="60" r="46"/>
          <circle class="fin-ring-unclass" cx="60" cy="60" r="46" id="finRingUnclass"/>
          <circle class="fin-ring-wrong"   cx="60" cy="60" r="46" id="finRingWrong"/>
          <circle class="fin-ring-fill"    cx="60" cy="60" r="46" id="finRingFill"/>
        </svg>
        <div class="fin-ring-center">
          <span class="fin-ring-pct" id="finPct">—</span>
          <span class="fin-ring-sub">correctas</span>
        </div>
      </div>
      <div class="fin-ring-legend">
        <span class="fin-ring-leg correct">Correctas</span>
        <span class="fin-ring-leg wrong">Erradas</span>
        <span class="fin-ring-leg skip">Sem resposta</span>
        <span class="fin-ring-leg unclass" id="finUnclassLeg" style="display:none">Não disponível</span>
      </div>
      <div class="fin-breakdown">
        <div class="fin-bd-item">
          <span class="fin-bd-num green" id="finCorrectN">0</span>
          <span class="fin-bd-label">Correctas</span>
        </div>
        <div class="fin-bd-divider"></div>
        <div class="fin-bd-item">
          <span class="fin-bd-num red" id="finWrongN">0</span>
          <span class="fin-bd-label">Erradas</span>
        </div>
      </div>
      <div class="finish-msg" id="finMsg"></div>
      <div class="finish-btns">
        <button class="btn-primary"   onclick="showReview()">🔍 Rever respostas</button>
        <button class="btn-secondary" onclick="restart()">↩ Recomeçar</button>
        <button class="btn-secondary" onclick="window.location.href='index.html'">← Início</button>
      </div>
    </div>
  </div>

  <div id="reviewScreen"></div>
</div>

<!-- Finish confirmation dialog -->
<div class="finish-confirm-overlay" id="finishConfirm" onclick="handleOverlayClick(event)">
  <div class="finish-confirm-dialog">
    <div class="fcd-header">
      <h3 id="fcdTitle">Terminar o Quiz?</h3>
      <button class="fcd-close" onclick="closeFinishConfirm()">✕</button>
    </div>
    <div class="fcd-body" id="fcdBody"></div>
    <div class="fcd-footer">
      <button class="btn-secondary" onclick="closeFinishConfirm()">Continuar quiz</button>
      <button class="btn-primary"   onclick="forceFinish()">Terminar mesmo assim</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══ STATE ═══════════════════════════════════════════════ */
let bank=null, bankId='', questions=[];
let cur=0, score=0, wrong=0, answered=false, sessionSeed=0;
let optionMaps=[], correctDisplayLetters=[], userAnswers=[];
const visitedSet       = new Set();
const unclassifiableSet= new Set(); // questions unavailable from shared link

const PROGRESS_PREFIX='mq_progress_';

/* ─── Helpers ─────────────────────────────── */
function hasVal(v){return v!=null&&String(v).trim()!=='';}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function buildLabTable(rows){
  if(!rows?.length)return'';
  return`<table class="lab-table"><thead><tr><th>Parâmetro</th><th>Valor</th><th>Referência</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td>${escHtml(r.param)}</td><td>${escHtml(r.value)}</td><td>${escHtml(r.ref??'')}</td></tr>`).join('')
  }</tbody></table>`;
}
function showError(html){
  document.getElementById('qcard').innerHTML=`<div style="padding:48px 24px;text-align:center;color:var(--muted)"><div style="font-size:2rem;margin-bottom:14px">⚠️</div><p style="font-size:.9rem;line-height:1.7;color:var(--text-2)">${html}</p></div>`;
  document.getElementById('progLabel').textContent='Erro';
}

/* ─── localStorage ────────────────────────── */
function saveProgress(){
  localStorage.setItem(PROGRESS_PREFIX+bankId, JSON.stringify({
    seed:sessionSeed, cur, score, wrong,
    answers:[...userAnswers],
    visited:[...visitedSet],
    unclassifiable:[...unclassifiableSet]
  }));
}
function loadProgress(){
  try{const r=localStorage.getItem(PROGRESS_PREFIX+bankId);return r?JSON.parse(r):null;}
  catch(_){return null;}
}
function clearProgress(){localStorage.removeItem(PROGRESS_PREFIX+bankId);}

/* ─── Toast ───────────────────────────────── */
let _tt;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;clearTimeout(_tt);void t.offsetWidth;t.classList.add('show');_tt=setTimeout(()=>t.classList.remove('show'),2200);}

/* ─── Colour helpers ──────────────────────── */
function shadeColor(hex,p){const n=parseInt(hex.replace('#',''),16);return'#'+((1<<24)|(Math.min(255,Math.max(0,(n>>16)+p))<<16)|(Math.min(255,Math.max(0,((n>>8)&0xff)+p))<<8)|Math.min(255,Math.max(0,(n&0xff)+p))).toString(16).slice(1);}
function hexToRgba(hex,a){const n=parseInt(hex.replace('#',''),16);return`rgba(${(n>>16)&0xff},${(n>>8)&0xff},${n&0xff},${a})`;}
function applyThemeColor(hex){const c=hex||'#1548E8';document.documentElement.style.setProperty('--quiz-color',c);document.documentElement.style.setProperty('--quiz-color-dark',shadeColor(c,-35));document.documentElement.style.setProperty('--quiz-glow',hexToRgba(c,.28));}

/* ─── Progress (answered-only) ────────────── */
function updateProgress(){
  const total=questions.length;
  const inScope=total-unclassifiableSet.size;
  const answered=userAnswers.filter((a,i)=>a!==null&&!unclassifiableSet.has(i)).length;
  const pct=inScope>0?Math.round(answered/inScope*100):0;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progPct').textContent=pct+'%';
  document.getElementById('progLabel').textContent=`Q${cur+1} / ${total}`;
}

/* ─── Counters with flip ──────────────────── */
function animateCounter(id,txt){const el=document.getElementById(id);if(!el||el.textContent===txt)return;el.textContent=txt;el.classList.remove('cnt-flip');void el.offsetWidth;el.classList.add('cnt-flip');}
function updateCounters(){animateCounter('cntRight',`✓ ${score}`);animateCounter('cntWrong',`✗ ${wrong}`);}

/* ─── Seed bar ────────────────────────────── */
function updateSeedBar(){document.getElementById('seedWrap').style.display='block';document.getElementById('seedDisplay').textContent=`${sessionSeed}:${cur}`;const p=new URLSearchParams(window.location.search);p.set('seed',sessionSeed);p.set('pos',cur);history.replaceState(null,'','?'+p.toString());}
function toggleSeedPanel(){const panel=document.getElementById('seedPanel'),toggle=document.getElementById('seedToggle');toggle.classList.toggle('open',panel.classList.toggle('open'));}
function copyLink(){const p=new URLSearchParams(window.location.search);p.set('seed',sessionSeed);p.set('pos',cur);const url=location.origin+location.pathname+'?'+p.toString();if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>showToast('✓ Link copiado!'));}else{const ta=document.createElement('textarea');ta.value=url;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('✓ Link copiado!');}}
function joinSeed(){const inp=document.getElementById('seedInput'),val=inp.value.trim();const parts=val.split(':'),num=parseInt(parts[0],10),pos=parts.length>1?Math.max(0,parseInt(parts[1],10)):0;if(!val||isNaN(num)||num<0){inp.classList.add('error');setTimeout(()=>inp.classList.remove('error'),1200);return;}inp.value='';initSession(num,isNaN(pos)?0:pos,0,0,[],new Set(Array.from({length:isNaN(pos)?0:pos},(_,i)=>i)));showToast(pos>0?`🔗 A começar na questão ${pos+1}`:'🔗 Sessão sincronizada!');window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('seedInput').addEventListener('keydown',e=>{if(e.key==='Enter')joinSeed();});});

/* ─── PRNG + shuffle ──────────────────────── */
function makePRNG(seed){let s=seed>>>0;return()=>{s+=0x6D2B79F5;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))>>>0;return((t^(t>>>14))>>>0)/4294967296;};}
function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ═══ NAVIGATION ══════════════════════════════════════════ */

function cellClass(i){
  if(i===cur)                      return 'qnav-current';
  if(unclassifiableSet.has(i))     return 'qnav-unclassifiable';
  if(userAnswers[i]!==null)        return userAnswers[i]===correctDisplayLetters[i]?'qnav-correct':'qnav-wrong';
  if(visitedSet.has(i))            return 'qnav-skipped';
  return 'qnav-untouched';
}

function buildCell(i,clickFn){
  const btn=document.createElement('button');
  btn.className=`qnav-cell ${cellClass(i)}`;
  btn.textContent=i+1; btn.title=`Questão ${i+1}`; btn.onclick=clickFn;
  return btn;
}

function updateNavStrip(){
  const total=questions.length;
  const strip=document.getElementById('qnavStrip');
  strip.innerHTML='';
  const half=2;
  let start=Math.max(0,cur-half), end=Math.min(total-1,cur+half);
  if(end-start<Math.min(4,total-1)){if(start===0)end=Math.min(total-1,4);else start=Math.max(0,end-4);}
  for(let i=start;i<=end;i++){const idx=i;strip.appendChild(buildCell(idx,()=>navigateTo(idx)));}
  document.getElementById('qnavPrev').disabled=(cur===0);
  document.getElementById('qnavNext').disabled=(cur===total-1);
  const wrap=document.getElementById('qnavStripWrap');
  if(wrap){wrap.classList.toggle('fade-left',start>0);wrap.classList.toggle('fade-right',end<total-1);}
  if(document.getElementById('qnavFull').classList.contains('open')) updateFullMap();
  updateBottomBar();
}

function updateFullMap(){
  const grid=document.getElementById('qnavFullGrid'); grid.innerHTML='';
  questions.forEach((_,i)=>{const idx=i;grid.appendChild(buildCell(idx,()=>{closeNavMap();navigateTo(idx);}));});
}

function toggleNavMap(){
  const full=document.getElementById('qnavFull'), btn=document.getElementById('qnavExpandBtn'), chev=document.getElementById('qnavChev');
  const isOpen=full.classList.toggle('open');
  btn.classList.toggle('active',isOpen); chev.style.transform=isOpen?'rotate(180deg)':'';
  if(isOpen){
    updateFullMap();
    setTimeout(()=>full.scrollIntoView({behavior:'smooth',block:'nearest'}),180);
  }
}

function closeNavMap(){
  const full=document.getElementById('qnavFull'), btn=document.getElementById('qnavExpandBtn'), chev=document.getElementById('qnavChev');
  full.classList.remove('open'); btn.classList.remove('active'); chev.style.transform='';
}

function updateBottomBar(){
  const skipBtn=document.getElementById('btnSkip'), nextBtn=document.getElementById('btnNext');
  const isLast=(cur===questions.length-1);
  if(answered){
    skipBtn.style.display='none'; skipBtn.classList.remove('btn-skip-last');
    nextBtn.style.display='block'; nextBtn.textContent=isLast?'Ver Resultado':'Próxima →';
  } else {
    nextBtn.style.display='none'; skipBtn.style.display='block';
    if(isLast){skipBtn.textContent='🏁 Terminar Quiz';skipBtn.classList.add('btn-skip-last');}
    else{skipBtn.textContent='Saltar';skipBtn.classList.remove('btn-skip-last');}
  }
}

function navigateTo(index){
  if(index<0||index>=questions.length)return;
  document.getElementById('expPanel').classList.remove('show');
  cur=index; saveProgress(); render(); window.scrollTo({top:0,behavior:'smooth'});
}
function navPrev(){navigateTo(cur-1);}
function navNext(){navigateTo(cur+1);}
function navSkip(){if(cur===questions.length-1){showFinishConfirm();return;}navigateTo(cur+1);}
function nextQuestion(){if(cur>=questions.length-1){showFinishConfirm();return;}navigateTo(cur+1);}

/* ═══ FINISH CONFIRM ══════════════════════════════════════ */

function showFinishConfirm(){
  const unanswered=[];
  for(let i=0;i<questions.length;i++) if(userAnswers[i]===null&&!unclassifiableSet.has(i)) unanswered.push(i);
  if(unanswered.length===0){doFinish();return;}
  document.getElementById('fcdTitle').textContent='Terminar o Quiz?';
  const cells=unanswered.map(i=>`<button class="qnav-cell qnav-skipped" onclick="closeDlgGoto(${i})" title="Ir para questão ${i+1}">${i+1}</button>`).join('');
  document.getElementById('fcdBody').innerHTML=`
    <div class="fcd-warning">
      <span class="fcd-warning-icon">⚠️</span>
      <span class="fcd-warning-text">Tens <strong>${unanswered.length}</strong> questão${unanswered.length!==1?'s':''} sem resposta. Se terminares agora, não pontuam.</span>
    </div>
    <div class="fcd-label">Questões sem resposta — clica para ir directamente:</div>
    <div class="fcd-cells">${cells}</div>`;
  document.getElementById('finishConfirm').classList.add('open');
}
function closeFinishConfirm(){document.getElementById('finishConfirm').classList.remove('open');}
function handleOverlayClick(e){if(e.target===document.getElementById('finishConfirm'))closeFinishConfirm();}
function closeDlgGoto(i){closeFinishConfirm();navigateTo(i);}
function forceFinish(){closeFinishConfirm();doFinish();}

/* ═══ BOOTSTRAP ═══════════════════════════════════════════ */

async function boot(){
  const params=new URLSearchParams(window.location.search);
  const bankFile=params.get('bank');
  if(!bankFile){showError('Nenhum quiz especificado.<br><a href="index.html">Voltar ao início</a>');return;}
  bankId=bankFile;
  if(bankFile==='local'){
    const raw=localStorage.getItem('mq_imported_bank');
    if(!raw){showError('Nenhum quiz importado.<br><a href="index.html">Voltar ao início</a>');return;}
    try{bank=JSON.parse(raw);}catch(_){showError('Erro ao ler quiz.<br><a href="index.html">Voltar ao início</a>');return;}
  } else {
    try{const res=await fetch(`data/${bankFile}`);if(!res.ok)throw new Error(`HTTP ${res.status}`);bank=await res.json();}
    catch(e){showError(`Não foi possível carregar <strong>${bankFile}</strong>.<br>${e.message}`);return;}
  }
  if(!bank.questions?.length){showError('O ficheiro JSON não contém questões válidas.');return;}
  document.title=`${bank.meta?.title||'Quiz'} — VésperaQUIZ`;
  applyThemeColor(bank.meta?.color);

  const urlSeed=parseInt(params.get('seed'),10), urlPos=parseInt(params.get('pos'),10);

  // Try saved progress first (reload persistence)
  const saved=loadProgress();

  if(!isNaN(urlSeed)){
    // Shared link — questions before urlPos are unclassifiable
    const unclass=new Set();
    const pos=!isNaN(urlPos)&&urlPos>0?urlPos:0;
    for(let i=0;i<pos;i++) unclass.add(i);

    // If we have saved progress FOR THIS EXACT SEED, restore it
    if(saved&&saved.seed===urlSeed){
      initSession(saved.seed, saved.cur, saved.score, saved.wrong,
        saved.answers||[], new Set(saved.unclassifiable||[]), new Set(saved.visited||[]));
      if(pos>0) showToast(`🔗 A começar na questão ${pos+1}`);
    } else {
      initSession(urlSeed, pos, 0, 0, [], unclass, new Set());
      if(pos>0) showToast(`🔗 A começar na questão ${pos+1}`);
    }
  } else if(saved&&saved.cur<bank.questions.length) {
    // Reload resume — restore everything
    initSession(saved.seed, saved.cur, saved.score, saved.wrong,
      saved.answers||[], new Set(saved.unclassifiable||[]), new Set(saved.visited||[]));
  } else {
    initSession(null,0,0,0,[],new Set(),new Set());
  }
}

/* ─── Resume prompt ───────────────────────── */
function initSessionWithResume(saved){
  const rng=makePRNG(saved.seed>>>0); shuffle(bank.questions.map((_,i)=>i),rng);
  const total=bank.questions.length, done=saved.cur;
  const pctDone=Math.round((done/total)*100), pctRight=done>0?Math.round((saved.score/done)*100):0;
  document.getElementById('qcard').innerHTML=`
    <div style="background:var(--quiz-color,#1548E8);padding:15px 22px;">
      <span style="font-size:.7rem;font-weight:600;color:rgba(255,255,255,.6)">Sessão guardada</span>
    </div>
    <div style="padding:32px 24px 28px;text-align:center;">
      <p style="font-size:.98rem;font-weight:700;color:var(--text);margin-bottom:8px">Tens uma sessão em curso</p>
      <p style="font-size:.84rem;color:var(--muted);margin-bottom:6px;line-height:1.6">
        Questão <strong style="color:var(--text-2)">${done+1} de ${total}</strong> &nbsp;·&nbsp;
        <span style="color:var(--green);font-weight:700">✓ ${saved.score}</span>&nbsp;
        <span style="color:var(--red);font-weight:700">✗ ${saved.wrong}</span>&nbsp;·&nbsp;${pctRight}% certas</p>
      <div style="height:5px;background:var(--cerulean-light);border-radius:99px;overflow:hidden;margin:14px 0 22px">
        <div style="height:5px;width:${pctDone}%;background:var(--quiz-color,#1548E8);border-radius:99px"></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button class="btn-primary" onclick="resumeSession(${JSON.stringify(saved).replace(/"/g,'&quot;')})">▶ Continuar</button>
        <button class="btn-secondary" onclick="initSession(null,0,0,0,[],new Set(),new Set())">↩ Recomeçar</button>
      </div>
    </div>`;
  document.getElementById('progFill').style.width=pctDone+'%';
  document.getElementById('progLabel').textContent=`Q${done+1} / ${total}`;
  document.getElementById('progPct').textContent=pctDone+'%';
}
function resumeSession(saved){
  initSession(saved.seed,saved.cur,saved.score,saved.wrong,
    saved.answers||[],new Set(saved.unclassifiable||[]),new Set(saved.visited||[]));
}

/* ─── qcard template ──────────────────────── */
function qcardTemplate(){return`
  <div class="qcard-header"><span class="q-num" id="qNum">–</span><div class="qcard-meta"><span class="domain" id="qDomain"></span><span class="level-badge" id="qLevel"></span></div></div>
  <div class="vignette-wrap" id="vignetteWrap" style="display:none"><div class="section-label-inline">Vinheta Clínica</div><div class="vignette-text" id="vignetteText"></div><div id="labTableWrap"></div></div>
  <div class="question-box"><div class="q-label">Questão</div><p id="questionText"></p></div>
  <div class="options" id="optionsContainer"></div>
  <div class="exp-panel" id="expPanel">
    <div class="exp-correct"><div class="exp-tag">✓ Resposta Correcta</div><p id="expText"></p><p class="exp-source" id="expSource"></p></div>
    <div class="logic-box" id="logicBox"><div class="logic-tag">Raciocínio</div><p id="logicText"></p></div>
    <div id="distSection"><div class="dist-header">Por que não as outras opções?</div><div class="dist-list" id="distList"></div></div>
  </div>`;}

/* ═══ INIT SESSION ════════════════════════════════════════ */

function initSession(forceSeed, startCur=0, startScore=0, startWrong=0,
                     savedAnswers=[], savedUnclass=new Set(), savedVisited=new Set()){
  sessionSeed=forceSeed!=null?(forceSeed>>>0):Math.floor(Math.random()*2**32);
  const rng=makePRNG(sessionSeed);
  const idx=shuffle(bank.questions.map((_,i)=>i),rng);
  questions=idx.map(i=>bank.questions[i]);

  const letters=['A','B','C','D','E'];
  optionMaps=[]; correctDisplayLetters=[]; userAnswers=new Array(questions.length).fill(null);
  questions.forEach(q=>{const sh=shuffle(q.options,rng);optionMaps.push(sh);const ci=sh.findIndex(o=>o.letter===q.correct);correctDisplayLetters.push(letters[ci]??q.correct);});

  cur=Math.min(Math.max(0,startCur),questions.length-1);
  score=startScore; wrong=startWrong; answered=false;

  // Restore persisted state
  if(savedAnswers.length===questions.length) userAnswers=[...savedAnswers];
  unclassifiableSet.clear(); savedUnclass.forEach(i=>unclassifiableSet.add(i));
  visitedSet.clear(); savedVisited.forEach(i=>visitedSet.add(i));

  // Recalculate score/wrong from answers for consistency
  score=0; wrong=0;
  userAnswers.forEach((a,i)=>{
    if(a===null||unclassifiableSet.has(i))return;
    if(a===correctDisplayLetters[i])score++;else wrong++;
  });

  document.getElementById('reviewScreen').style.display='none';
  document.getElementById('finishScreen').style.display='none';
  document.getElementById('finishConfirm').classList.remove('open');
  closeNavMap();

  const qcard=document.getElementById('qcard'); qcard.style.display='block';
  if(!qcard.querySelector('#qNum')) qcard.innerHTML=qcardTemplate();
  document.getElementById('qnavArea').style.display='block';
  document.getElementById('btnNext').style.display='none';
  document.getElementById('btnSkip').style.display='none';

  updateCounters(); updateSeedBar(); saveProgress(); render();
}

/* ═══ RENDER ══════════════════════════════════════════════ */

function render(){
  const q=questions[cur], dispOpts=optionMaps[cur], letters=['A','B','C','D','E'];
  visitedSet.add(cur);

  updateProgress();
  document.getElementById('qNum').textContent=`Q${cur+1} / ${questions.length}`;

  const domEl=document.getElementById('qDomain'), domV=hasVal(q.domain)?q.domain:'';
  domEl.textContent=domV; domEl.style.display=domV?'':'none';
  const lvlEl=document.getElementById('qLevel'),  lvlV=hasVal(q.level)?q.level:'';
  lvlEl.textContent=lvlV; lvlEl.style.display=lvlV?'':'none';

  const vigWrap=document.getElementById('vignetteWrap'), qcard=document.getElementById('qcard');
  if(hasVal(q.vignette)){vigWrap.style.display='block';qcard.classList.add('has-vignette');document.getElementById('vignetteText').textContent=q.vignette;document.getElementById('labTableWrap').innerHTML=q.labTable?.length?buildLabTable(q.labTable):'';}
  else{vigWrap.style.display='none';qcard.classList.remove('has-vignette');}

  document.getElementById('questionText').textContent=q.question;

  const container=document.getElementById('optionsContainer');
  container.innerHTML='';

  const isUnclass=unclassifiableSet.has(cur);

  dispOpts.forEach((opt,i)=>{
    const dl=letters[i], div=document.createElement('div');
    div.className='opt'+(isUnclass?' disabled':'');
    div.style.setProperty('--oi',i);
    div.dataset.dispLetter=dl; div.dataset.origLetter=opt.letter;
    div.innerHTML=`<span class="letter">${dl}</span><span>${escHtml(opt.text)}</span>`;
    if(!isUnclass) div.addEventListener('click',()=>selectAnswer(dl));
    container.appendChild(div);
  });

  // Mobile: prevent sticky hover from previous question
  container.style.pointerEvents='none';
  requestAnimationFrame(()=>{ container.style.pointerEvents=''; });

  qcard.classList.remove('q-entering'); void qcard.offsetWidth; qcard.classList.add('q-entering');

  if(isUnclass){
    // Unclassifiable: show disabled view, no exp, note
    answered=true;
    document.getElementById('expPanel').classList.remove('show');
    document.getElementById('btnSkip').style.display='none';
    document.getElementById('btnNext').style.display='none';
    // Show a gentle note instead
    const expPanel=document.getElementById('expPanel');
    expPanel.classList.remove('show');
  } else if(userAnswers[cur]!==null){
    answered=true; showAnswerState(cur);
  } else {
    answered=false; document.getElementById('expPanel').classList.remove('show');
  }

  updateSeedBar(); updateNavStrip();
}

/* ═══ ANSWER STATE ════════════════════════════════════════ */

function showAnswerState(idx){
  const q=questions[idx], dispOpts=optionMaps[idx], letters=['A','B','C','D','E'];
  const correctDisp=correctDisplayLetters[idx], chosenDisp=userAnswers[idx];
  const origToDisp={};dispOpts.forEach((opt,i)=>{origToDisp[opt.letter]=letters[i];});
  document.querySelectorAll('.opt').forEach(el=>{
    el.classList.add('disabled');const l=el.dataset.dispLetter;
    if(l===correctDisp)el.classList.add('correct');
    else if(l===chosenDisp)el.classList.add('wrong');
    else el.classList.add('neutral');
  });
  document.getElementById('expText').textContent=q.explanation??'';
  const srcEl=document.getElementById('expSource');
  if(hasVal(q.source)){srcEl.textContent=`📚 Fonte: ${q.source}`;srcEl.style.display='';}
  else{srcEl.textContent='';srcEl.style.display='none';}
  const logicBox=document.getElementById('logicBox');
  if(hasVal(q.logic)){document.getElementById('logicText').textContent=q.logic;logicBox.style.display='';}
  else logicBox.style.display='none';
  const distList=document.getElementById('distList'); distList.innerHTML='';
  const displayOrder=['A','B','C','D','E'];
  const validDist=(q.distractors??[]).filter(d=>d.letter!==q.correct&&hasVal(d.text))
    .sort((a,b)=>displayOrder.indexOf(origToDisp[a.letter])-displayOrder.indexOf(origToDisp[b.letter]));
  validDist.forEach(d=>{
    const ml=origToDisp[d.letter]??d.letter, div=document.createElement('div');
    div.className='dist-item';
    div.innerHTML=`<span class="dist-tag">${ml}) Incorrecta</span><p>${escHtml(d.text)}</p>${hasVal(d.source)?`<p class="dist-source">📚 ${escHtml(d.source)}</p>`:''}`;
    distList.appendChild(div);
  });
  document.getElementById('distSection').style.display=validDist.length?'':'none';
  document.getElementById('expPanel').classList.add('show');
  updateBottomBar();
}

/* ═══ SELECT ANSWER ═══════════════════════════════════════ */

function selectAnswer(chosenDisp){
  if(answered||unclassifiableSet.has(cur))return;
  answered=true;
  const correctDisp=correctDisplayLetters[cur], ok=(chosenDisp===correctDisp);
  if(ok)score++;else wrong++;
  userAnswers[cur]=chosenDisp;
  updateCounters(); updateProgress(); saveProgress();
  showAnswerState(cur); updateNavStrip();
  setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),120);
}

/* ═══ FINISH ══════════════════════════════════════════════ */

function doFinish(){
  clearProgress();
  document.getElementById('qcard').style.display='none';
  document.getElementById('qnavArea').style.display='none';
  document.getElementById('finishScreen').style.display='block';
  document.getElementById('progFill').style.width='100%';
  document.getElementById('progPct').textContent='100%';
  document.getElementById('progLabel').textContent=`${questions.length} / ${questions.length} questões`;
  updateCounters();

  const total=questions.length;
  const inScope=total-unclassifiableSet.size;
  const pct=inScope>0?Math.round(score/inScope*100):0;
  const medal=pct===100?'🏆':pct>=85?'🥇':pct>=70?'🥈':pct>=55?'🥉':'📖';
  const msgs={'🏆':'Perfeição absoluta! Domínio total do tema.','🥇':'Excelente! Estás muito bem preparado para o exame.','🥈':'Muito bom! Revê os erros para consolidar o conhecimento.','🥉':'Razoável. Foca-te nos pontos mais fracos antes do exame.','📖':'Há trabalho pela frente. Revê o material e tenta novamente.'};

  document.getElementById('finMedal').textContent=medal;
  document.getElementById('finTitle').textContent=bank.meta?.title??'Quiz Concluído';
  document.getElementById('finScore').textContent=`${score} / ${inScope}`;
  document.getElementById('finCorrectN').textContent=score;
  document.getElementById('finWrongN').textContent=inScope-score;
  document.getElementById('finMsg').textContent=msgs[medal];
  document.getElementById('finPct').textContent=`${pct}%`;

  // Show unclassifiable legend only if any exist
  const hasUnclass=unclassifiableSet.size>0;
  document.getElementById('finUnclassLeg').style.display=hasUnclass?'':'none';

  // Ring chart: correct + (wrong+skipped in scope) + unclassifiable = full circle
  const C=2*Math.PI*46;
  const correctLen=C*score/total;
  const inScopeWrong=inScope-score;         // wrong + skipped in scope
  const wrongLen=C*inScopeWrong/total;
  const unclassLen=C*unclassifiableSet.size/total;

  const fillEl=document.getElementById('finRingFill');
  const wrongEl=document.getElementById('finRingWrong');
  const unclEl=document.getElementById('finRingUnclass');

  // Setup initial hidden states
  fillEl.style.transition='none';
  fillEl.style.strokeDasharray=correctLen>0?`${correctLen} ${C}`:`0 ${C}`;
  fillEl.style.strokeDashoffset=correctLen;

  wrongEl.style.strokeDasharray=wrongLen>0?`${wrongLen} ${C}`:`0 ${C}`;
  wrongEl.style.strokeDashoffset=`${correctLen}`;
  wrongEl.style.transition='none'; wrongEl.style.opacity='0';

  unclEl.style.strokeDasharray=unclassLen>0?`${unclassLen} ${C}`:`0 ${C}`;
  unclEl.style.strokeDashoffset=`${correctLen+wrongLen}`;
  unclEl.style.transition='none'; unclEl.style.opacity='0';

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    fillEl.style.transition='stroke-dashoffset .9s cubic-bezier(.22,.68,0,1.2)';
    fillEl.style.strokeDashoffset='0';
    setTimeout(()=>{wrongEl.style.transition='opacity .4s ease';wrongEl.style.opacity='1';},700);
    setTimeout(()=>{unclEl.style.transition='opacity .4s ease';unclEl.style.opacity='1';},1100);
  }));

  window.scrollTo({top:0,behavior:'smooth'});
}

function showFinish(){showFinishConfirm();}

function restart(){
  clearProgress();
  document.getElementById('finishScreen').style.display='none';
  document.getElementById('reviewScreen').style.display='none';
  document.getElementById('qcard').style.display='block';
  initSession(null,0,0,0,[],new Set(),new Set());
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ═══ REVIEW ══════════════════════════════════════════════ */

function showReview(){
  document.getElementById('finishScreen').style.display='none';
  document.getElementById('qcard').style.display='none';
  const letters=['A','B','C','D','E'], pct=Math.round(score/(questions.length-unclassifiableSet.size||1)*100);

  const mapCells=questions.map((_,i)=>{
    const c=userAnswers[i],d=correctDisplayLetters[i];
    let cls; if(unclassifiableSet.has(i))cls='unclassifiable'; else if(c===null)cls='skipped'; else cls=c===d?'correct':'wrong';
    return`<button class="qmap-cell ${cls}" onclick="document.getElementById('rev-q-${i}').scrollIntoView({behavior:'smooth',block:'start'})" title="Q${i+1}">${i+1}</button>`;
  }).join('');

  let html=`
    <div class="review-topbar">
      <div><div class="review-title">Revisão de Respostas</div><div class="review-subtitle">${escHtml(bank.meta?.title??'')}</div></div>
      <button class="btn-review-back" onclick="backToFinish()">← Resultado</button>
    </div>
    <div class="qmap-outer"><div class="qmap-inner">
      <div class="qmap-header"><span class="qmap-title">Mapa de questões</span><div class="qmap-legend"><span class="qmap-dot green">Correcta</span><span class="qmap-dot red">Errada</span><span class="qmap-dot gray">N/R</span>${unclassifiableSet.size>0?'<span class="qmap-dot pink">N/disponível</span>':''}</div></div>
      <div class="qmap-grid">${mapCells}</div>
    </div></div>
    <div class="review-summary">
      <div class="review-summary-pill">${questions.length} questões</div>
      <div class="review-summary-pill green">✓ ${score} correctas</div>
      <div class="review-summary-pill red">✗ ${wrong} erradas</div>
      <div class="review-summary-pill">${pct}% de sucesso</div>
    </div>`;

  questions.forEach((q,i)=>{
    const dispOpts=optionMaps[i], correctDisp=correctDisplayLetters[i], chosenDisp=userAnswers[i];
    const isUnclass=unclassifiableSet.has(i);
    const wasCorrect=chosenDisp===correctDisp, wasSkipped=chosenDisp===null&&!isUnclass;
    const cardClass=isUnclass?'was-unclassifiable':wasSkipped?'':wasCorrect?'was-correct':'was-wrong';
    const badgeClass=isUnclass?'unclassifiable':wasSkipped?'skipped':wasCorrect?'correct':'wrong';
    const badgeText=isUnclass?'— Não disponível':wasSkipped?'— N/R':wasCorrect?'✓ Correcta':'✗ Errada';
    const origToDisp={};dispOpts.forEach((opt,idx)=>{origToDisp[opt.letter]=letters[idx];});
    const vigHtml=hasVal(q.vignette)?`<div class="review-vignette">${escHtml(q.vignette)}</div>${q.labTable?.length?buildLabTable(q.labTable):''}`:'' ;
    const optsHtml=dispOpts.map((opt,idx)=>{const dl=letters[idx];let cls='review-opt';if(dl===correctDisp&&!isUnclass)cls+=' opt-correct';else if(dl===chosenDisp)cls+=' opt-wrong-chosen';else cls+=' opt-neutral';return`<div class="${cls}"><span class="letter">${dl}</span><span>${escHtml(opt.text)}</span></div>`;}).join('');
    const displayOrder=['A','B','C','D','E'];
    const validDist=(q.distractors??[]).filter(d=>d.letter!==q.correct&&hasVal(d.text)).sort((a,b)=>displayOrder.indexOf(origToDisp[a.letter])-displayOrder.indexOf(origToDisp[b.letter]));
    const distsHtml=validDist.map(d=>{const ml=origToDisp[d.letter]??d.letter;return`<div class="review-dist-item"><span class="tag">${ml}) Incorrecta</span><p>${escHtml(d.text)}</p>${hasVal(d.source)?`<p class="review-dist-source">📚 ${escHtml(d.source)}</p>`:''}</div>`;}).join('');
    const metaParts=[q.level,q.domain].filter(v=>hasVal(v));
    html+=`<div class="review-card ${cardClass}" id="rev-q-${i}">
      <div class="review-card-header">
        <div class="review-card-num-wrap"><span class="review-q-idx">${String(i+1).padStart(2,'0')}</span>${metaParts.length?`<span class="review-card-meta-text">${escHtml(metaParts.join(' · '))}</span>`:''}</div>
        <span class="review-result-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="review-card-body">${vigHtml}<div class="review-question">${escHtml(q.question)}</div><div class="review-opts">${optsHtml}</div></div>
      ${!isUnclass?`<div class="review-exp">
        <div class="review-exp-correct"><span class="tag">✓ Resposta Correcta</span><p>${escHtml(q.explanation??'')}</p>${hasVal(q.source)?`<p class="review-exp-source">📚 Fonte: ${escHtml(q.source)}</p>`:''}</div>
        ${hasVal(q.logic)?`<div class="review-logic"><span class="tag">Raciocínio</span><p>${escHtml(q.logic)}</p></div>`:''}
        ${distsHtml?`<div class="review-dist-header">Por que não as outras?</div><div class="dist-list">${distsHtml}</div>`:''}
      </div>`:''}
    </div>`;
  });

  html+=`<div style="text-align:center;padding:8px 0 24px"><button class="btn-review-back" onclick="backToFinish()">← Voltar ao resultado</button></div>`;
  const rs=document.getElementById('reviewScreen');rs.innerHTML=html;rs.style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function backToFinish(){document.getElementById('reviewScreen').style.display='none';document.getElementById('finishScreen').style.display='block';window.scrollTo({top:0,behavior:'smooth'});}

boot();
</script>
