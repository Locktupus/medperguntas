<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>MedQuiz</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .vignette-text { font-size: 1.05rem; line-height: 1.85; }
    .qcard-header {
      background: linear-gradient(135deg, var(--quiz-color-dark, #1e3a5f) 0%, var(--quiz-color, #1d4ed8) 100%);
    }
    .prog-fill { background: var(--quiz-color, #3b82f6); }
    .btn-next {
      background: linear-gradient(135deg, var(--quiz-color-dark, #2563eb), var(--quiz-color, #1d4ed8));
      box-shadow: 0 2px 8px rgba(29,78,216,.3);
    }
    .section-label-inline::before { background: var(--quiz-color, #1d4ed8); }
    .bottom-bar { justify-content: space-between; align-items: center; min-height: 50px; }
    .question-box { margin-top: 20px; }
    .has-vignette .question-box { margin-top: 0; }
 
    /* Score counters */
    .score-counters {
      display: flex; gap: 0; border-radius: 10px; overflow: hidden;
      border: 1.5px solid var(--slate-mid); background: #fff; flex-shrink: 0;
    }
    .score-counter {
      padding: 9px 16px; font-size: .85rem; font-weight: 700;
      display: flex; align-items: center; gap: 6px;
    }
    .score-counter.right { background: #f0fdf4; color: #15803d; border-right: 1.5px solid var(--slate-mid); }
    .score-counter.wrong { background: #fef2f2; color: #b91c1c; }
 
    /* Seed dropdown */
    .seed-wrap { max-width: 860px; margin: 8px auto 0; padding: 0 16px; }
    .btn-seed-toggle {
      background: none; border: none; cursor: pointer; font-size: .72rem;
      font-weight: 600; color: var(--sub); display: flex; align-items: center;
      gap: 5px; padding: 2px 0; transition: color .15s;
    }
    .btn-seed-toggle:hover { color: var(--slate); }
    .btn-seed-toggle .arrow { display: inline-block; transition: transform .2s ease; font-style: normal; }
    .btn-seed-toggle.open .arrow { transform: rotate(180deg); }
    .seed-panel {
      display: none; margin-top: 8px; background: #fff;
      border: 1.5px solid var(--slate-mid); border-radius: 12px;
      padding: 14px 16px; gap: 12px; flex-wrap: wrap; align-items: center;
    }
    .seed-panel.open { display: flex; }
    .seed-group { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .seed-label { font-size: .72rem; color: var(--sub); font-weight: 600; white-space: nowrap; }
    .seed-code {
      font-family: 'Courier New', monospace; font-size: .78rem; font-weight: 700;
      color: var(--slate); background: var(--slate-light); border: 1.5px solid var(--slate-mid);
      border-radius: 7px; padding: 4px 10px; letter-spacing: .05em;
    }
    .btn-seed-copy {
      font-size: .72rem; font-weight: 700; color: var(--blue); background: var(--blue-light);
      border: 1.5px solid var(--blue-mid); border-radius: 7px; padding: 4px 10px;
      cursor: pointer; transition: opacity .15s; white-space: nowrap;
    }
    .btn-seed-copy:hover { opacity: .8; }
    .seed-divider { width: 1px; height: 20px; background: var(--slate-mid); flex-shrink: 0; }
    .seed-input {
      font-family: 'Courier New', monospace; font-size: .78rem; width: 120px;
      border: 1.5px solid var(--slate-mid); border-radius: 7px; padding: 4px 8px;
      color: var(--slate); outline: none; transition: border-color .15s;
    }
    .seed-input:focus { border-color: #93c5fd; }
    .seed-input.error { border-color: #f87171; }
    .btn-seed-join {
      font-size: .72rem; font-weight: 700; color: #fff; background: var(--blue, #1d4ed8);
      border: none; border-radius: 7px; padding: 5px 11px; cursor: pointer;
      transition: opacity .15s; white-space: nowrap;
    }
    .btn-seed-join:hover { opacity: .85; }
 
    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #1e293b; color: #fff; padding: 9px 20px; border-radius: 99px;
      font-size: .82rem; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.2);
      transition: transform .25s ease, opacity .25s ease;
      opacity: 0; pointer-events: none; z-index: 999;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
 
<nav class="topbar">
  <div class="topbar-logo">
    🥼
    <span style="color:#ffffff;font-weight:900;font-size:1.1rem;">Compilações de Exercícios</span>
    <span style="color:rgba(255,255,255,0.7);">Medicina</span>
  </div>
  <a class="topbar-back topbar-btn" href="index.html">← Início</a>
</nav>
 
<div class="prog-wrap">
  <div class="prog-top">
    <span id="progLabel">A carregar…</span>
    <span id="progPct">0%</span>
  </div>
  <div class="prog-bg"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
</div>
 
<div class="seed-wrap" id="seedWrap" style="display:none">
  <button class="btn-seed-toggle" id="seedToggle" onclick="toggleSeedPanel()">
    <i class="arrow">▾</i> Sincronizar com outra sessão
  </button>
  <div class="seed-panel" id="seedPanel">
    <div class="seed-group">
      <span class="seed-label">A tua sessão:</span>
      <span class="seed-code" id="seedDisplay">–</span>
      <button class="btn-seed-copy" onclick="copyLink()">Copiar link</button>
    </div>
    <div class="seed-divider"></div>
    <div class="seed-group">
      <span class="seed-label">Entrar com seed:</span>
      <input class="seed-input" id="seedInput" type="text" placeholder="seed ou seed:questão" maxlength="20">
      <button class="btn-seed-join" onclick="joinSeed()">Ir</button>
    </div>
  </div>
</div>
 
<div class="page" style="padding-top:14px; padding-bottom:20px;">
  <div class="qcard" id="qcard">
    <div class="qcard-header">
      <div class="q-num" id="qNum">–</div>
      <div class="qcard-meta">
        <div class="domain" id="qDomain"></div>
        <span class="level-badge" id="qLevel"></span>
      </div>
    </div>
    <div class="vignette-wrap" id="vignetteWrap" style="display:none">
      <div class="section-label-inline">Vinheta Clínica</div>
      <div class="vignette-text" id="vignetteText"></div>
      <div id="labTableWrap"></div>
    </div>
    <div class="question-box"><p id="questionText"></p></div>
    <div class="options" id="optionsContainer"></div>
    <div class="exp-panel" id="expPanel">
      <div class="exp-correct">
        <div class="exp-tag">✅ Resposta Correcta</div>
        <p id="expText"></p>
        <p class="exp-source" id="expSource"></p>
      </div>
      <div class="logic-box">
        <div class="logic-tag">🔗 Raciocínio</div>
        <p id="logicText"></p>
      </div>
      <div class="dist-header">❌ Distratores</div>
      <div class="dist-list" id="distList"></div>
    </div>
  </div>
 
  <div class="bottom-bar">
    <div class="score-counters">
      <div class="score-counter right" id="cntRight">✓ 0</div>
      <div class="score-counter wrong" id="cntWrong">✗ 0</div>
    </div>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Próxima →</button>
  </div>
 
  <div class="finish" id="finishScreen">
    <div class="finish-header">
      <h2 id="finTitle">Quiz Concluído! 🎉</h2>
      <p id="finSubtitle"></p>
    </div>
    <div class="finish-body">
      <div class="finish-score" id="finScore"></div>
      <div class="finish-pct"  id="finPct"></div>
      <div class="finish-msg"  id="finMsg"></div>
      <div class="finish-btns">
        <button class="btn-primary"   onclick="restart()">Recomeçar</button>
        <button class="btn-secondary" onclick="window.location.href='index.html'">← Início</button>
      </div>
    </div>
  </div>
</div>
 
<div class="toast" id="toast"></div>
 
<script>
/* ══════════════════════════════════════════════════════
   MedQuiz — Quiz Engine
   · Seeded shuffle (questions + answers)
   · Progress saved to localStorage on every advance
   · Seed sharing with position sync (?seed=X&pos=N)
══════════════════════════════════════════════════════ */
 
let bank      = null;
let bankId    = '';       // key used for localStorage progress
let questions = [];
let cur       = 0;
let score     = 0;
let wrong     = 0;
let answered  = false;
let sessionSeed = 0;
let optionMaps            = [];
let correctDisplayLetters = [];
 
const PROGRESS_PREFIX = 'mq_progress_';
 
/* ─── localStorage helpers ──────────────────────────── */
function saveProgress() {
  const data = { seed: sessionSeed, cur, score, wrong };
  localStorage.setItem(PROGRESS_PREFIX + bankId, JSON.stringify(data));
}
 
function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_PREFIX + bankId);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}
 
function clearProgress() {
  localStorage.removeItem(PROGRESS_PREFIX + bankId);
}
 
/* ─── Toast ─────────────────────────────────────────── */
let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  clearTimeout(_toastTimer);
  void t.offsetWidth;
  t.classList.add('show');
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
 
/* ─── Colour helper ─────────────────────────────────── */
function shadeColor(hex, pct) {
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, Math.max(0, (n >> 16) + pct));
  const g = Math.min(255, Math.max(0, ((n >> 8) & 0xff) + pct));
  const b = Math.min(255, Math.max(0, (n & 0xff) + pct));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
 
function applyThemeColor(hex) {
  const color     = hex || '#1d4ed8';
  const colorDark = shadeColor(color, -35);
  document.documentElement.style.setProperty('--quiz-color',      color);
  document.documentElement.style.setProperty('--quiz-color-dark', colorDark);
}
 
/* ─── Counters ──────────────────────────────────────── */
function updateCounters() {
  document.getElementById('cntRight').textContent = `✓ ${score}`;
  document.getElementById('cntWrong').textContent = `✗ ${wrong}`;
}
 
/* ─── Seed bar ──────────────────────────────────────── */
function updateSeedBar() {
  document.getElementById('seedWrap').style.display = 'block';
  // Display seed:position so the code itself is self-contained
  document.getElementById('seedDisplay').textContent = `${sessionSeed}:${cur}`;
  const params = new URLSearchParams(window.location.search);
  params.set('seed', sessionSeed);
  params.set('pos',  cur);
  history.replaceState(null, '', '?' + params.toString());
}
 
function toggleSeedPanel() {
  const panel  = document.getElementById('seedPanel');
  const toggle = document.getElementById('seedToggle');
  const open   = panel.classList.toggle('open');
  toggle.classList.toggle('open', open);
}
 
function copyLink() {
  // Always put the current position in the link
  const params = new URLSearchParams(window.location.search);
  params.set('seed', sessionSeed);
  params.set('pos',  cur);
  const url = window.location.origin + window.location.pathname + '?' + params.toString();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => showToast('✓ Link copiado!'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('✓ Link copiado!');
  }
}
 
function joinSeed() {
  const input = document.getElementById('seedInput');
  const val   = input.value.trim();
 
  // Accept two formats:
  //   "2847361905"      → seed only, start at question 0
  //   "2847361905:7"    → seed + position (colon-separated)
  const parts = val.split(':');
  const num   = parseInt(parts[0], 10);
  const pos   = parts.length > 1 ? Math.max(0, parseInt(parts[1], 10)) : 0;
 
  if (!val || isNaN(num) || num < 0) {
    input.classList.add('error');
    setTimeout(() => input.classList.remove('error'), 1200);
    return;
  }
 
  input.value = '';
  initSession(num, isNaN(pos) ? 0 : pos);
  const msg = pos > 0
    ? `🔗 Sessão sincronizada — a começar na questão ${pos + 1}`
    : '🔗 Sessão sincronizada!';
  showToast(msg);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
 
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('seedInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') joinSeed();
  });
});
 
/* ─── Seeded PRNG (Mulberry32) ──────────────────────── */
function makePRNG(seed) {
  let s = seed >>> 0;
  return function() {
    s += 0x6D2B79F5;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) >>> 0;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
 
function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
 
/* ─── Bootstrap ─────────────────────────────────────── */
async function boot() {
  const params   = new URLSearchParams(window.location.search);
  const bankFile = params.get('bank');
 
  if (!bankFile) {
    showError('Nenhum ficheiro de quiz especificado na URL.<br>Volta à <a href="index.html">página inicial</a>.');
    return;
  }
 
  bankId = bankFile; // used as localStorage key
 
  if (bankFile === 'local') {
    const raw = localStorage.getItem('mq_imported_bank');
    if (!raw) {
      showError('Nenhum quiz importado encontrado.<br>Volta à <a href="index.html">página inicial</a> e importa um ficheiro JSON.');
      return;
    }
    try { bank = JSON.parse(raw); }
    catch (_) {
      showError('Erro ao ler o quiz importado.<br>Volta à <a href="index.html">página inicial</a> e importa novamente.');
      return;
    }
  } else {
    try {
      const res = await fetch(`data/${bankFile}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      bank = await res.json();
    } catch (e) {
      showError(`Não foi possível carregar <strong>${bankFile}</strong>.<br>${e.message}<br>Volta à <a href="index.html">página inicial</a>.`);
      return;
    }
  }
 
  if (!bank.questions || !Array.isArray(bank.questions) || !bank.questions.length) {
    showError('O ficheiro JSON não contém questões válidas.');
    return;
  }
 
  document.title = `Compilações de Exercícios — ${bank.meta?.title || 'Quiz'}`;
  applyThemeColor(bank.meta?.color);
 
  const urlSeed = parseInt(params.get('seed'), 10);
  const urlPos  = parseInt(params.get('pos'),  10);
  const hasSeedInURL = !isNaN(urlSeed);
  const hasPosInURL  = !isNaN(urlPos) && urlPos > 0;
 
  if (hasSeedInURL) {
    // Shared link — use seed from URL, jump to position (mark previous as correct)
    initSession(urlSeed, hasPosInURL ? urlPos : 0);
    if (hasPosInURL) showToast(`🔗 A começar na questão ${urlPos + 1}`);
  } else {
    // No URL seed — check for saved progress
    const saved = loadProgress();
    if (saved && saved.cur > 0 && saved.cur < bank.questions.length) {
      // Offer to continue — boot will wait; show resume UI inside initSession
      initSessionWithResume(saved);
    } else {
      initSession(null, 0);
    }
  }
}
 
/* ─── Init with resume prompt ───────────────────────── */
function initSessionWithResume(saved) {
  // Build the session silently first so we can show stats
  const rng = makePRNG(saved.seed >>> 0);
  const indices = bank.questions.map((_, i) => i);
  const shuffledIndices = shuffle(indices, rng);
  const qs = shuffledIndices.map(i => bank.questions[i]);
  const displayLetters = ['A','B','C','D','E'];
  const om = [], cdl = [];
  qs.forEach(q => {
    const so = shuffle(q.options, rng);
    om.push(so);
    const ci = so.findIndex(o => o.letter === q.correct);
    cdl.push(displayLetters[ci] ?? q.correct);
  });
 
  // Show resume card instead of quiz card
  const total    = qs.length;
  const done     = saved.cur;
  const pctDone  = Math.round((done / total) * 100);
  const pctRight = done > 0 ? Math.round((saved.score / done) * 100) : 0;
 
  document.getElementById('qcard').innerHTML = `
    <div style="padding:32px 24px;text-align:center;">
      <div style="font-size:2rem;margin-bottom:12px">📖</div>
      <div style="font-size:1rem;font-weight:700;color:var(--text);margin-bottom:6px">
        Tens uma sessão em curso
      </div>
      <div style="font-size:.85rem;color:var(--sub);margin-bottom:20px;line-height:1.6">
        Questão <strong>${done + 1} de ${total}</strong> &nbsp;·&nbsp;
        <span style="color:#15803d;font-weight:700">✓ ${saved.score}</span> &nbsp;
        <span style="color:#b91c1c;font-weight:700">✗ ${saved.wrong}</span> &nbsp;·&nbsp;
        ${pctRight}% certas
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button class="btn-primary" onclick="resumeSession(${JSON.stringify(saved).replace(/"/g,'&quot;')})">
          ▶ Continuar
        </button>
        <button class="btn-secondary" onclick="initSession(null,0)">
          ↩ Recomeçar
        </button>
      </div>
    </div>`;
  // Hide progress bar until resumed
  document.getElementById('progFill').style.width = pctDone + '%';
  document.getElementById('progLabel').textContent = `Questão ${done + 1} de ${total}`;
  document.getElementById('progPct').textContent   = pctDone + '%';
}
 
function resumeSession(saved) {
  initSession(saved.seed, saved.cur, saved.score, saved.wrong);
}
 
/* ─── Initialise session ────────────────────────────── */
// forceSeed: number or null (generate random)
// startCur:  question index to start at (default 0)
// startScore/startWrong: for resume
function initSession(forceSeed, startCur = 0, startScore = 0, startWrong = 0) {
  sessionSeed = (forceSeed != null) ? (forceSeed >>> 0) : Math.floor(Math.random() * 2 ** 32);
  const rng   = makePRNG(sessionSeed);
 
  const indices         = bank.questions.map((_, i) => i);
  const shuffledIndices = shuffle(indices, rng);
  questions             = shuffledIndices.map(i => bank.questions[i]);
 
  const displayLetters  = ['A','B','C','D','E'];
  optionMaps            = [];
  correctDisplayLetters = [];
 
  questions.forEach(q => {
    const shuffledOpts = shuffle(q.options, rng);
    optionMaps.push(shuffledOpts);
    const correctIdx = shuffledOpts.findIndex(o => o.letter === q.correct);
    correctDisplayLetters.push(displayLetters[correctIdx] ?? q.correct);
  });
 
  // Clamp startCur to valid range
  cur   = Math.min(Math.max(0, startCur), questions.length - 1);
  score = startScore;
  wrong = startWrong;
 
  // If joining from a shared link with pos > 0, count skipped as correct
  if (startCur > 0 && startScore === 0 && startWrong === 0) {
    score = startCur;
  }
 
  answered = false;
 
  // Restore quiz card if it was replaced by the resume prompt
  const qcard = document.getElementById('qcard');
  if (!qcard.querySelector('.qcard-header')) {
    qcard.innerHTML = `
      <div class="qcard-header">
        <div class="q-num" id="qNum">–</div>
        <div class="qcard-meta">
          <div class="domain" id="qDomain"></div>
          <span class="level-badge" id="qLevel"></span>
        </div>
      </div>
      <div class="vignette-wrap" id="vignetteWrap" style="display:none">
        <div class="section-label-inline">Vinheta Clínica</div>
        <div class="vignette-text" id="vignetteText"></div>
        <div id="labTableWrap"></div>
      </div>
      <div class="question-box"><p id="questionText"></p></div>
      <div class="options" id="optionsContainer"></div>
      <div class="exp-panel" id="expPanel">
        <div class="exp-correct">
          <div class="exp-tag">✅ Resposta Correcta</div>
          <p id="expText"></p>
          <p class="exp-source" id="expSource"></p>
        </div>
        <div class="logic-box">
          <div class="logic-tag">🔗 Raciocínio</div>
          <p id="logicText"></p>
        </div>
        <div class="dist-header">❌ Distratores</div>
        <div class="dist-list" id="distList"></div>
      </div>`;
  }
 
  // Hide finish screen if visible
  document.getElementById('finishScreen').style.display = 'none';
  qcard.style.display = 'block';
 
  updateCounters();
  updateSeedBar();
  saveProgress();
  render();
}
 
/* ─── Render ────────────────────────────────────────── */
function render() {
  const q              = questions[cur];
  const displayOpts    = optionMaps[cur];
  const displayLetters = ['A','B','C','D','E'];
 
  answered = false;
 
  const pct = Math.round((cur / questions.length) * 100);
  document.getElementById('progFill').style.width  = pct + '%';
  document.getElementById('progLabel').textContent = `Questão ${cur + 1} de ${questions.length}`;
  document.getElementById('progPct').textContent   = pct + '%';
 
  document.getElementById('qNum').textContent    = `Q${cur + 1} / ${questions.length}`;
  document.getElementById('qDomain').textContent = q.domain ?? '';
  document.getElementById('qLevel').textContent  = q.level  ?? '';
 
  const vigWrap = document.getElementById('vignetteWrap');
  const qcard   = document.getElementById('qcard');
  if (q.vignette) {
    vigWrap.style.display = 'block';
    qcard.classList.add('has-vignette');
    document.getElementById('vignetteText').textContent = q.vignette;
    document.getElementById('labTableWrap').innerHTML   = buildLabTable(q.labTable);
  } else {
    vigWrap.style.display = 'none';
    qcard.classList.remove('has-vignette');
  }
 
  document.getElementById('questionText').textContent = q.question;
 
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  displayOpts.forEach((opt, idx) => {
    const dispLetter = displayLetters[idx];
    const div = document.createElement('div');
    div.className = 'opt';
    div.dataset.dispLetter = dispLetter;
    div.dataset.origLetter = opt.letter;
    div.innerHTML = `<span class="letter">${dispLetter}</span><span>${opt.text}</span>`;
    div.addEventListener('click', () => selectAnswer(dispLetter));
    container.appendChild(div);
  });
 
  document.getElementById('expPanel').classList.remove('show');
  document.getElementById('btnNext').style.display = 'none';
 
  // Update URL pos
  updateSeedBar();
}
 
/* ─── Answer selection ──────────────────────────────── */
function selectAnswer(chosenDisp) {
  if (answered) return;
  answered = true;
 
  const correctDisp = correctDisplayLetters[cur];
  const ok          = chosenDisp === correctDisp;
  if (ok) score++; else wrong++;
  updateCounters();
  saveProgress();
 
  document.querySelectorAll('.opt').forEach(el => {
    el.classList.add('disabled');
    const l = el.dataset.dispLetter;
    if      (l === correctDisp) el.classList.add('correct');
    else if (l === chosenDisp)  el.classList.add('wrong');
    else                        el.classList.add('neutral');
  });
 
  const q              = questions[cur];
  const displayOpts    = optionMaps[cur];
  const displayLetters = ['A','B','C','D','E'];
 
  document.getElementById('expText').textContent   = q.explanation ?? '';
  document.getElementById('expSource').textContent = q.source ? `📚 Fonte: ${q.source}` : '';
  document.getElementById('logicText').textContent = q.logic ?? '';
 
  const origToDisp = {};
  displayOpts.forEach((opt, idx) => { origToDisp[opt.letter] = displayLetters[idx]; });
 
  const distList     = document.getElementById('distList');
  const displayOrder = ['A','B','C','D','E'];
  distList.innerHTML = '';
 
  (q.distractors ?? [])
    .filter(d => d.letter !== q.correct)
    .sort((a, b) => displayOrder.indexOf(origToDisp[a.letter]) - displayOrder.indexOf(origToDisp[b.letter]))
    .forEach(d => {
      const mappedDisp = origToDisp[d.letter] ?? d.letter;
      const div = document.createElement('div');
      div.className = 'dist-item';
      div.innerHTML = `
        <span class="dist-tag">${mappedDisp}) Incorrecta</span>
        <p>${d.text}</p>
        ${d.source ? `<p class="dist-source">📚 ${d.source}</p>` : ''}`;
      distList.appendChild(div);
    });
 
  document.getElementById('expPanel').classList.add('show');
 
  const btn = document.getElementById('btnNext');
  btn.style.display = 'block';
  btn.textContent   = cur < questions.length - 1 ? 'Próxima →' : 'Ver Resultado';
 
  setTimeout(() => { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }, 120);
}
 
/* ─── Next / finish ─────────────────────────────────── */
function nextQuestion() {
  cur++;
  if (cur >= questions.length) { showFinish(); return; }
  saveProgress();
  document.getElementById('expPanel').classList.remove('show');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
 
function showFinish() {
  clearProgress(); // done — remove saved state
  document.getElementById('qcard').style.display        = 'none';
  document.getElementById('btnNext').style.display      = 'none';
  document.getElementById('finishScreen').style.display = 'block';
  document.getElementById('progFill').style.width       = '100%';
  document.getElementById('progPct').textContent        = '100%';
  document.getElementById('progLabel').textContent      = `${questions.length} de ${questions.length} questões`;
 
  const pct = Math.round((score / questions.length) * 100);
  let msg = '';
  if      (pct >= 85) msg = '🏆 Excelente! Domínio sólido do tema. Estás pronto para o exame.';
  else if (pct >= 65) msg = '👍 Bom resultado! Revê os casos onde erraste, focando nos distratores.';
  else                msg = '📖 Continua a estudar — volta ao material de estudo e refaz os casos.';
 
  document.getElementById('finTitle').textContent    = bank.meta?.title ?? 'Quiz Concluído! 🎉';
  document.getElementById('finSubtitle').textContent = bank.meta?.subtitle ?? '';
  document.getElementById('finScore').textContent    = `${score} / ${questions.length}`;
  document.getElementById('finPct').textContent      = `${pct}% de respostas correctas`;
  document.getElementById('finMsg').textContent      = msg;
 
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
 
function restart() {
  clearProgress();
  document.getElementById('finishScreen').style.display = 'none';
  document.getElementById('qcard').style.display        = 'block';
  initSession(null, 0);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
 
/* ─── Helpers ───────────────────────────────────────── */
function buildLabTable(rows) {
  if (!rows || !rows.length) return '';
  const thead = `<thead><tr><th>Parâmetro</th><th>Valor</th><th>Referência</th></tr></thead>`;
  const tbody = rows.map(r =>
    `<tr><td>${r.param}</td><td>${r.value}</td><td>${r.ref ?? ''}</td></tr>`
  ).join('');
  return `<table class="lab-table">${thead}<tbody>${tbody}</tbody></table>`;
}
 
function showError(html) {
  document.getElementById('qcard').innerHTML = `
    <div style="padding:40px 24px;text-align:center;color:var(--sub)">
      <div style="font-size:2rem;margin-bottom:12px">⚠️</div>
      <p style="font-size:.92rem;line-height:1.7">${html}</p>
    </div>`;
  document.getElementById('progLabel').textContent = 'Erro ao carregar';
}
 
boot();
</script>
