<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Compilações de Exercícios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="topbar">
  <div class="topbar-logo">
    🥼 Compilações de Exercícios
    <span class="sep">|</span>
    <span class="sub">Medicina</span>
  </div>
  <a class="topbar-back" href="index.html">← Início</a>
</nav>

<div class="prog-wrap">
  <div class="prog-top">
    <span id="progLabel">A carregar…</span>
    <span id="progPct">0%</span>
  </div>
  <div class="prog-bg">
    <div class="prog-fill" id="progFill" style="width:0%"></div>
  </div>
</div>

<div class="seed-wrap" id="seedWrap" style="display:none">
  <button class="btn-seed-toggle" id="seedToggle" onclick="toggleSeedPanel()">
    <i class="arrow">▾</i> Sincronizar com outra sessão
  </button>
  <div class="seed-panel" id="seedPanel">
    <div class="seed-group">
      <span class="seed-label">A tua sessão:</span>
      <span class="seed-code" id="seedDisplay">–</span>
      <button class="btn-seed-copy" onclick="copyLink()">Copiar link</button>
    </div>
    <div class="seed-divider"></div>
    <div class="seed-group">
      <span class="seed-label">Entrar com seed:</span>
      <input class="seed-input" id="seedInput" type="text"
             placeholder="seed ou seed:questão" maxlength="25">
      <button class="btn-seed-join" onclick="joinSeed()">Ir</button>
    </div>
  </div>
</div>

<div class="page" style="padding-top:14px; padding-bottom:20px;">

  <!-- Quiz card -->
  <div class="qcard" id="qcard">
    <div class="qcard-header">
      <span class="q-num" id="qNum">–</span>
      <div class="qcard-meta">
        <span class="domain" id="qDomain"></span>
        <span class="level-badge" id="qLevel"></span>
      </div>
    </div>

    <div class="vignette-wrap" id="vignetteWrap" style="display:none">
      <div class="section-label-inline">Vinheta Clínica</div>
      <div class="vignette-text" id="vignetteText"></div>
      <div id="labTableWrap"></div>
    </div>

    <div class="question-box">
      <p id="questionText"></p>
    </div>

    <div class="options" id="optionsContainer"></div>

    <div class="exp-panel" id="expPanel">
      <div class="exp-correct">
        <div class="exp-tag">✓ Resposta Correcta</div>
        <p id="expText"></p>
        <p class="exp-source" id="expSource"></p>
      </div>
      <div class="logic-box" id="logicBox">
        <div class="logic-tag">Raciocínio</div>
        <p id="logicText"></p>
      </div>
      <div id="distSection">
        <div class="dist-header">Por que não as outras opções?</div>
        <div class="dist-list" id="distList"></div>
      </div>
    </div>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="score-counters">
      <div class="score-counter right" id="cntRight">✓ 0</div>
      <div class="score-counter wrong"  id="cntWrong">✗ 0</div>
    </div>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Próxima →</button>
  </div>

  <!-- Finish screen -->
  <div class="finish" id="finishScreen">
    <div class="finish-header">
      <h2 id="finTitle">Quiz Concluído</h2>
      <p id="finSubtitle"></p>
    </div>
    <div class="finish-body">
      <div class="finish-score" id="finScore"></div>
      <div class="finish-pct"   id="finPct"></div>
      <div class="finish-msg"   id="finMsg"></div>
      <div class="finish-btns">
        <button class="btn-primary"   onclick="showReview()">🔍 Rever respostas</button>
        <button class="btn-secondary" onclick="restart()">↩ Recomeçar</button>
        <button class="btn-secondary" onclick="window.location.href='index.html'">← Início</button>
      </div>
    </div>
  </div>

  <!-- Review screen -->
  <div id="reviewScreen"></div>

</div>

<div class="toast" id="toast"></div>

<script>
let bank      = null;
let bankId    = '';
let questions = [];
let cur       = 0;
let score     = 0;
let wrong     = 0;
let answered  = false;
let sessionSeed = 0;
let optionMaps            = [];
let correctDisplayLetters = [];
let userAnswers           = [];

const PROGRESS_PREFIX = 'mq_progress_';

/* ─── Helpers ─────────────────────────────── */
function hasVal(v) { return v != null && String(v).trim() !== ''; }

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function buildLabTable(rows) {
  if (!rows || !rows.length) return '';
  const thead = `<thead><tr><th>Parâmetro</th><th>Valor</th><th>Referência</th></tr></thead>`;
  const tbody = rows.map(r =>
    `<tr><td>${escHtml(r.param)}</td><td>${escHtml(r.value)}</td><td>${escHtml(r.ref ?? '')}</td></tr>`
  ).join('');
  return `<table class="lab-table">${thead}<tbody>${tbody}</tbody></table>`;
}

function showError(html) {
  document.getElementById('qcard').innerHTML = `
    <div style="padding:48px 24px;text-align:center;color:var(--muted)">
      <div style="font-size:2rem;margin-bottom:14px">⚠️</div>
      <p style="font-size:.9rem;line-height:1.7;color:var(--text-2)">${html}</p>
    </div>`;
  document.getElementById('progLabel').textContent = 'Erro ao carregar';
}

/* ─── localStorage ────────────────────────── */
function saveProgress() {
  localStorage.setItem(PROGRESS_PREFIX + bankId, JSON.stringify({ seed: sessionSeed, cur, score, wrong }));
}
function loadProgress() {
  try { const r = localStorage.getItem(PROGRESS_PREFIX + bankId); return r ? JSON.parse(r) : null; }
  catch (_) { return null; }
}
function clearProgress() { localStorage.removeItem(PROGRESS_PREFIX + bankId); }

/* ─── Toast ───────────────────────────────── */
let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  clearTimeout(_toastTimer);
  void t.offsetWidth;
  t.classList.add('show');
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ─── Colour helper ───────────────────────── */
function shadeColor(hex, pct) {
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, Math.max(0, (n >> 16) + pct));
  const g = Math.min(255, Math.max(0, ((n >> 8) & 0xff) + pct));
  const b = Math.min(255, Math.max(0, (n & 0xff) + pct));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function applyThemeColor(hex) {
  const c = hex || '#1955D6';
  document.documentElement.style.setProperty('--quiz-color',      c);
  document.documentElement.style.setProperty('--quiz-color-dark', shadeColor(c, -35));
}

/* ─── Counters ────────────────────────────── */
function updateCounters() {
  document.getElementById('cntRight').textContent = `✓ ${score}`;
  document.getElementById('cntWrong').textContent = `✗ ${wrong}`;
}

/* ─── Seed bar ────────────────────────────── */
function updateSeedBar() {
  document.getElementById('seedWrap').style.display = 'block';
  document.getElementById('seedDisplay').textContent = `${sessionSeed}:${cur}`;
  const params = new URLSearchParams(window.location.search);
  params.set('seed', sessionSeed); params.set('pos', cur);
  history.replaceState(null, '', '?' + params.toString());
}
function toggleSeedPanel() {
  const panel = document.getElementById('seedPanel');
  const toggle = document.getElementById('seedToggle');
  const open = panel.classList.toggle('open');
  toggle.classList.toggle('open', open);
}
function copyLink() {
  const params = new URLSearchParams(window.location.search);
  params.set('seed', sessionSeed); params.set('pos', cur);
  const url = window.location.origin + window.location.pathname + '?' + params.toString();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => showToast('✓ Link copiado!'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('✓ Link copiado!');
  }
}
function joinSeed() {
  const input = document.getElementById('seedInput');
  const val   = input.value.trim();
  const parts = val.split(':');
  const num   = parseInt(parts[0], 10);
  const pos   = parts.length > 1 ? Math.max(0, parseInt(parts[1], 10)) : 0;
  if (!val || isNaN(num) || num < 0) {
    input.classList.add('error');
    setTimeout(() => input.classList.remove('error'), 1200); return;
  }
  input.value = '';
  initSession(num, isNaN(pos) ? 0 : pos);
  showToast(pos > 0 ? `🔗 A começar na questão ${pos + 1}` : '🔗 Sessão sincronizada!');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('seedInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') joinSeed();
  });
});

/* ─── PRNG + shuffle ──────────────────────── */
function makePRNG(seed) {
  let s = seed >>> 0;
  return function() {
    s += 0x6D2B79F5;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) >>> 0;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ─── Bootstrap ───────────────────────────── */
async function boot() {
  const params   = new URLSearchParams(window.location.search);
  const bankFile = params.get('bank');
  if (!bankFile) {
    showError('Nenhum ficheiro de quiz especificado.<br>Volta à <a href="index.html">página inicial</a>.');
    return;
  }
  bankId = bankFile;
  if (bankFile === 'local') {
    const raw = localStorage.getItem('mq_imported_bank');
    if (!raw) { showError('Nenhum quiz importado.<br>Volta à <a href="index.html">página inicial</a>.'); return; }
    try { bank = JSON.parse(raw); }
    catch (_) { showError('Erro ao ler o quiz importado.<br>Volta à <a href="index.html">página inicial</a>.'); return; }
  } else {
    try {
      const res = await fetch(`data/${bankFile}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      bank = await res.json();
    } catch (e) {
      showError(`Não foi possível carregar <strong>${bankFile}</strong>.<br>${e.message}<br>Volta à <a href="index.html">página inicial</a>.`);
      return;
    }
  }
  if (!bank.questions || !Array.isArray(bank.questions) || !bank.questions.length) {
    showError('O ficheiro JSON não contém questões válidas.'); return;
  }
  document.title = `Compilações — ${bank.meta?.title || 'Quiz'}`;
  applyThemeColor(bank.meta?.color);

  const urlSeed = parseInt(params.get('seed'), 10);
  const urlPos  = parseInt(params.get('pos'),  10);
  if (!isNaN(urlSeed)) {
    initSession(urlSeed, !isNaN(urlPos) && urlPos > 0 ? urlPos : 0);
    if (!isNaN(urlPos) && urlPos > 0) showToast(`🔗 A começar na questão ${urlPos + 1}`);
  } else {
    const saved = loadProgress();
    if (saved && saved.cur > 0 && saved.cur < bank.questions.length) {
      initSessionWithResume(saved);
    } else {
      initSession(null, 0);
    }
  }
}

/* ─── Resume prompt ───────────────────────── */
function initSessionWithResume(saved) {
  const rng  = makePRNG(saved.seed >>> 0);
  shuffle(bank.questions.map((_, i) => i), rng); // consume rng
  const total    = bank.questions.length;
  const done     = saved.cur;
  const pctDone  = Math.round((done / total) * 100);
  const pctRight = done > 0 ? Math.round((saved.score / done) * 100) : 0;

  document.getElementById('qcard').innerHTML = `
    <div class="qcard-header" style="background:var(--quiz-color, var(--blue))">
      <span class="q-num" style="color:rgba(255,255,255,.75)">Sessão guardada</span>
    </div>
    <div style="padding:32px 24px;text-align:center;">
      <p style="font-size:.95rem;font-weight:600;color:var(--text);margin-bottom:8px">
        Tens uma sessão em curso
      </p>
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:6px;line-height:1.6">
        Questão <strong style="color:var(--text-2)">${done + 1} de ${total}</strong> &nbsp;·&nbsp;
        <span style="color:var(--green);font-weight:600">✓ ${saved.score}</span>&nbsp;
        <span style="color:var(--red);font-weight:600">✗ ${saved.wrong}</span>&nbsp;·&nbsp;
        ${pctRight}% certas
      </p>
      <div style="margin:0 0 22px;height:4px;background:var(--blue-100);border-radius:99px;overflow:hidden">
        <div style="height:4px;width:${pctDone}%;background:var(--quiz-color,var(--blue));border-radius:99px"></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button class="btn-primary" onclick="resumeSession(${JSON.stringify(saved).replace(/"/g,'&quot;')})">
          ▶ Continuar
        </button>
        <button class="btn-secondary" onclick="initSession(null,0)">↩ Recomeçar</button>
      </div>
    </div>`;

  document.getElementById('progFill').style.width  = pctDone + '%';
  document.getElementById('progLabel').textContent = `Questão ${done + 1} de ${total}`;
  document.getElementById('progPct').textContent   = pctDone + '%';
}
function resumeSession(saved) { initSession(saved.seed, saved.cur, saved.score, saved.wrong); }

/* ─── Init session ────────────────────────── */
function initSession(forceSeed, startCur = 0, startScore = 0, startWrong = 0) {
  sessionSeed = (forceSeed != null) ? (forceSeed >>> 0) : Math.floor(Math.random() * 2 ** 32);
  const rng   = makePRNG(sessionSeed);

  const shuffledIdx = shuffle(bank.questions.map((_, i) => i), rng);
  questions         = shuffledIdx.map(i => bank.questions[i]);

  const letters = ['A','B','C','D','E'];
  optionMaps            = [];
  correctDisplayLetters = [];
  userAnswers           = new Array(questions.length).fill(null);

  questions.forEach(q => {
    const sh = shuffle(q.options, rng);
    optionMaps.push(sh);
    const ci = sh.findIndex(o => o.letter === q.correct);
    correctDisplayLetters.push(letters[ci] ?? q.correct);
  });

  cur   = Math.min(Math.max(0, startCur), questions.length - 1);
  score = startScore;
  wrong = startWrong;
  if (startCur > 0 && startScore === 0 && startWrong === 0) score = startCur;
  answered = false;

  document.getElementById('reviewScreen').style.display  = 'none';
  document.getElementById('finishScreen').style.display  = 'none';
  const qcard = document.getElementById('qcard');
  qcard.style.display = 'block';

  if (!qcard.querySelector('.qcard-header')) {
    qcard.innerHTML = `
      <div class="qcard-header">
        <span class="q-num" id="qNum">–</span>
        <div class="qcard-meta">
          <span class="domain" id="qDomain"></span>
          <span class="level-badge" id="qLevel"></span>
        </div>
      </div>
      <div class="vignette-wrap" id="vignetteWrap" style="display:none">
        <div class="section-label-inline">Vinheta Clínica</div>
        <div class="vignette-text" id="vignetteText"></div>
        <div id="labTableWrap"></div>
      </div>
      <div class="question-box"><p id="questionText"></p></div>
      <div class="options" id="optionsContainer"></div>
      <div class="exp-panel" id="expPanel">
        <div class="exp-correct">
          <div class="exp-tag">✓ Resposta Correcta</div>
          <p id="expText"></p>
          <p class="exp-source" id="expSource"></p>
        </div>
        <div class="logic-box" id="logicBox">
          <div class="logic-tag">Raciocínio</div>
          <p id="logicText"></p>
        </div>
        <div id="distSection">
          <div class="dist-header">Por que não as outras opções?</div>
          <div class="dist-list" id="distList"></div>
        </div>
      </div>`;
  }

  document.getElementById('btnNext').style.display = 'none';
  updateCounters();
  updateSeedBar();
  saveProgress();
  render();
}

/* ─── Render ──────────────────────────────── */
function render() {
  const q       = questions[cur];
  const dispOpts = optionMaps[cur];
  const letters  = ['A','B','C','D','E'];
  answered = false;

  const pct = Math.round((cur / questions.length) * 100);
  document.getElementById('progFill').style.width  = pct + '%';
  document.getElementById('progLabel').textContent = `Questão ${cur + 1} de ${questions.length}`;
  document.getElementById('progPct').textContent   = pct + '%';

  document.getElementById('qNum').textContent = `Q${cur + 1} / ${questions.length}`;

  // Domain — hide if empty
  const domEl = document.getElementById('qDomain');
  const domV  = hasVal(q.domain) ? q.domain : '';
  domEl.textContent    = domV;
  domEl.style.display  = domV ? '' : 'none';

  // Level — hide if empty
  const lvlEl = document.getElementById('qLevel');
  const lvlV  = hasVal(q.level) ? q.level : '';
  lvlEl.textContent   = lvlV;
  lvlEl.style.display = lvlV ? '' : 'none';

  // Vignette
  const vigWrap = document.getElementById('vignetteWrap');
  const qcard   = document.getElementById('qcard');
  if (hasVal(q.vignette)) {
    vigWrap.style.display = 'block';
    qcard.classList.add('has-vignette');
    document.getElementById('vignetteText').textContent = q.vignette;
    document.getElementById('labTableWrap').innerHTML   =
      (q.labTable && q.labTable.length) ? buildLabTable(q.labTable) : '';
  } else {
    vigWrap.style.display = 'none';
    qcard.classList.remove('has-vignette');
  }

  document.getElementById('questionText').textContent = q.question;

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  dispOpts.forEach((opt, idx) => {
    const dl  = letters[idx];
    const div = document.createElement('div');
    div.className = 'opt';
    div.dataset.dispLetter = dl;
    div.dataset.origLetter = opt.letter;
    div.innerHTML = `<span class="letter">${dl}</span><span>${escHtml(opt.text)}</span>`;
    div.addEventListener('click', () => selectAnswer(dl));
    container.appendChild(div);
  });

  document.getElementById('expPanel').classList.remove('show');
  document.getElementById('btnNext').style.display = 'none';
  updateSeedBar();
}

/* ─── Answer selection ────────────────────── */
function selectAnswer(chosenDisp) {
  if (answered) return;
  answered = true;

  const correctDisp = correctDisplayLetters[cur];
  const ok          = chosenDisp === correctDisp;
  if (ok) score++; else wrong++;
  userAnswers[cur] = chosenDisp;
  updateCounters();
  saveProgress();

  document.querySelectorAll('.opt').forEach(el => {
    el.classList.add('disabled');
    const l = el.dataset.dispLetter;
    if      (l === correctDisp) el.classList.add('correct');
    else if (l === chosenDisp)  el.classList.add('wrong');
    else                        el.classList.add('neutral');
  });

  const q        = questions[cur];
  const dispOpts = optionMaps[cur];
  const letters  = ['A','B','C','D','E'];

  // Explanation
  document.getElementById('expText').textContent = q.explanation ?? '';

  // Source
  const srcEl = document.getElementById('expSource');
  if (hasVal(q.source)) {
    srcEl.textContent   = `📚 Fonte: ${q.source}`;
    srcEl.style.display = '';
  } else {
    srcEl.textContent   = '';
    srcEl.style.display = 'none';
  }

  // Logic box
  const logicBox = document.getElementById('logicBox');
  if (hasVal(q.logic)) {
    document.getElementById('logicText').textContent = q.logic;
    logicBox.style.display = '';
  } else {
    logicBox.style.display = 'none';
  }

  // Distractors
  const origToDisp  = {};
  dispOpts.forEach((opt, idx) => { origToDisp[opt.letter] = letters[idx]; });
  const displayOrder = ['A','B','C','D','E'];

  const distList  = document.getElementById('distList');
  distList.innerHTML = '';

  const validDist = (q.distractors ?? [])
    .filter(d => d.letter !== q.correct && hasVal(d.text))
    .sort((a, b) =>
      displayOrder.indexOf(origToDisp[a.letter]) -
      displayOrder.indexOf(origToDisp[b.letter]));

  validDist.forEach(d => {
    const ml  = origToDisp[d.letter] ?? d.letter;
    const div = document.createElement('div');
    div.className = 'dist-item';
    div.innerHTML = `
      <span class="dist-tag">${ml}) Incorrecta</span>
      <p>${escHtml(d.text)}</p>
      ${hasVal(d.source) ? `<p class="dist-source">📚 ${escHtml(d.source)}</p>` : ''}`;
    distList.appendChild(div);
  });

  document.getElementById('distSection').style.display = validDist.length ? '' : 'none';
  document.getElementById('expPanel').classList.add('show');

  const btn = document.getElementById('btnNext');
  btn.style.display = 'block';
  btn.textContent   = cur < questions.length - 1 ? 'Próxima →' : 'Ver Resultado';

  setTimeout(() => { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }, 120);
}

/* ─── Next / finish ───────────────────────── */
function nextQuestion() {
  cur++;
  if (cur >= questions.length) { showFinish(); return; }
  saveProgress();
  document.getElementById('expPanel').classList.remove('show');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showFinish() {
  clearProgress();
  document.getElementById('qcard').style.display        = 'none';
  document.getElementById('btnNext').style.display      = 'none';
  document.getElementById('finishScreen').style.display = 'block';
  document.getElementById('progFill').style.width       = '100%';
  document.getElementById('progPct').textContent        = '100%';
  document.getElementById('progLabel').textContent      = `${questions.length} de ${questions.length} questões`;

  const pct = Math.round((score / questions.length) * 100);
  let msg = pct >= 85
    ? '🏆 Excelente! Domínio sólido do tema. Estás pronto para o exame.'
    : pct >= 65
      ? '👍 Bom resultado! Revê os casos onde erraste, focando nos distratores.'
      : '📖 Continua a estudar — volta ao material e refaz os casos.';

  document.getElementById('finTitle').textContent    = bank.meta?.title ?? 'Quiz Concluído';
  document.getElementById('finSubtitle').textContent = bank.meta?.subtitle ?? '';
  document.getElementById('finScore').textContent    = `${score} / ${questions.length}`;
  document.getElementById('finPct').textContent      = `${pct}% de respostas correctas`;
  document.getElementById('finMsg').textContent      = msg;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  clearProgress();
  document.getElementById('finishScreen').style.display = 'none';
  document.getElementById('reviewScreen').style.display = 'none';
  document.getElementById('qcard').style.display        = 'block';
  initSession(null, 0);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ─── Review mode ─────────────────────────── */
function showReview() {
  document.getElementById('finishScreen').style.display = 'none';
  document.getElementById('qcard').style.display        = 'none';
  document.getElementById('btnNext').style.display      = 'none';

  const letters = ['A','B','C','D','E'];
  const pct     = Math.round((score / questions.length) * 100);

  let html = `
    <div class="review-topbar">
      <div>
        <div class="review-title">🔍 Revisão de respostas</div>
        <div class="review-subtitle">${escHtml(bank.meta?.title ?? '')}</div>
      </div>
      <button class="btn-review-back" onclick="backToFinish()">← Resultado</button>
    </div>
    <div class="review-summary">
      <div class="review-summary-pill">${questions.length} questões</div>
      <div class="review-summary-pill green">✓ ${score} correctas</div>
      <div class="review-summary-pill red">✗ ${wrong} erradas</div>
      <div class="review-summary-pill">${pct}% de sucesso</div>
    </div>`;

  questions.forEach((q, i) => {
    const dispOpts    = optionMaps[i];
    const correctDisp = correctDisplayLetters[i];
    const chosenDisp  = userAnswers[i];
    const wasCorrect  = chosenDisp === correctDisp;
    const wasSkipped  = chosenDisp === null;

    const cardClass  = wasSkipped ? '' : wasCorrect ? 'was-correct' : 'was-wrong';
    const badgeClass = wasSkipped ? 'skipped' : wasCorrect ? 'correct' : 'wrong';
    const badgeText  = wasSkipped ? '— Não respondida' : wasCorrect ? '✓ Correcta' : '✗ Errada';

    const origToDisp = {};
    dispOpts.forEach((opt, idx) => { origToDisp[opt.letter] = letters[idx]; });

    const vigHtml = hasVal(q.vignette)
      ? `<div class="review-vignette">${escHtml(q.vignette)}</div>
         ${(q.labTable && q.labTable.length) ? buildLabTable(q.labTable) : ''}`
      : '';

    const optsHtml = dispOpts.map((opt, idx) => {
      const dl = letters[idx];
      let cls = 'review-opt';
      if      (dl === correctDisp) cls += ' opt-correct';
      else if (dl === chosenDisp)  cls += ' opt-wrong-chosen';
      else                         cls += ' opt-neutral';
      return `<div class="${cls}"><span class="letter">${dl}</span><span>${escHtml(opt.text)}</span></div>`;
    }).join('');

    const displayOrder = ['A','B','C','D','E'];
    const validDist    = (q.distractors ?? [])
      .filter(d => d.letter !== q.correct && hasVal(d.text))
      .sort((a, b) =>
        displayOrder.indexOf(origToDisp[a.letter]) - displayOrder.indexOf(origToDisp[b.letter]));

    const distsHtml = validDist.map(d => {
      const ml = origToDisp[d.letter] ?? d.letter;
      return `<div class="review-dist-item">
        <span class="tag">${ml}) Incorrecta</span>
        <p>${escHtml(d.text)}</p>
        ${hasVal(d.source) ? `<p class="review-dist-source">📚 ${escHtml(d.source)}</p>` : ''}
      </div>`;
    }).join('');

    const metaParts = [q.level, q.domain].filter(v => hasVal(v));
    const metaStr   = metaParts.length ? ' · ' + metaParts.join(' · ') : '';

    html += `
      <div class="review-card ${cardClass}">
        <div class="review-card-header">
          <span class="review-card-num">Questão ${i + 1} de ${questions.length}${escHtml(metaStr)}</span>
          <span class="review-result-badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="review-card-body">
          ${vigHtml}
          <div class="review-question">${escHtml(q.question)}</div>
          <div class="review-opts">${optsHtml}</div>
        </div>
        <div class="review-exp">
          <div class="review-exp-correct">
            <span class="tag">✓ Resposta Correcta</span>
            <p>${escHtml(q.explanation ?? '')}</p>
            ${hasVal(q.source) ? `<p class="review-exp-source">📚 Fonte: ${escHtml(q.source)}</p>` : ''}
          </div>
          ${hasVal(q.logic) ? `<div class="review-logic">
            <span class="tag">Raciocínio</span>
            <p>${escHtml(q.logic)}</p>
          </div>` : ''}
          ${distsHtml ? `<div class="review-dist-header">Por que não as outras?</div>${distsHtml}` : ''}
        </div>
      </div>`;
  });

  html += `<div style="text-align:center;padding:8px 0 24px">
    <button class="btn-review-back" onclick="backToFinish()">← Voltar ao resultado</button>
  </div>`;

  const rs = document.getElementById('reviewScreen');
  rs.innerHTML = html;
  rs.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function backToFinish() {
  document.getElementById('reviewScreen').style.display = 'none';
  document.getElementById('finishScreen').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

boot();
</script>
</body>
</html>
