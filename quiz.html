<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedQuiz</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .vignette-text { font-size: 1.05rem; line-height: 1.85; }
 
    .qcard-header {
      background: linear-gradient(135deg, var(--quiz-color-dark, #1e3a5f) 0%, var(--quiz-color, #1d4ed8) 100%);
    }
    .prog-fill {
      background: var(--quiz-color, #3b82f6);
    }
    .btn-next {
      background: linear-gradient(135deg, var(--quiz-color-dark, #2563eb), var(--quiz-color, #1d4ed8));
      box-shadow: 0 2px 8px rgba(29,78,216,.3);
    }
    .section-label-inline::before {
      background: var(--quiz-color, #1d4ed8);
    }
  </style>
</head>
<body>
 
<!-- TOP BAR -->
<nav class="topbar">
  <div class="topbar-logo">🩺 <span style="color:#fff;font-weight:900;font-size:1.1rem;">MedQuiz</span></div>
  <div class="score-pill" id="scorePill">0 / 0</div>
  <a class="topbar-back" href="index.html">← Início</a>
</nav>
 
<!-- PROGRESS -->
<div class="prog-wrap">
  <div class="prog-top">
    <span id="progLabel">A carregar…</span>
    <span id="progPct">0%</span>
  </div>
  <div class="prog-bg"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
</div>
 
<!-- QUIZ CARD -->
<div class="page" style="padding-top:14px; padding-bottom:20px;">
  <div class="qcard" id="qcard">
 
    <div class="qcard-header">
      <div class="q-num" id="qNum">–</div>
      <div class="qcard-meta">
        <div class="domain" id="qDomain"></div>
        <span class="level-badge" id="qLevel"></span>
      </div>
    </div>
 
    <!-- Vignette -->
    <div class="vignette-wrap" id="vignetteWrap" style="display:none">
      <div class="section-label-inline">Vinheta Clínica</div>
      <div class="vignette-text" id="vignetteText"></div>
      <div id="labTableWrap"></div>
    </div>
 
    <!-- Question -->
    <div class="question-box"><p id="questionText"></p></div>
 
    <!-- Options -->
    <div class="options" id="optionsContainer"></div>
 
    <!-- Explanation (hidden until answered) -->
    <div class="exp-panel" id="expPanel">
      <div class="exp-correct">
        <div class="exp-tag">✅ Resposta Correcta</div>
        <p id="expText"></p>
        <p class="exp-source" id="expSource"></p>
      </div>
      <div class="logic-box">
        <div class="logic-tag">🔗 Raciocínio</div>
        <p id="logicText"></p>
      </div>
      <div class="dist-header">❌ Distratores</div>
      <div class="dist-list" id="distList"></div>
    </div>
 
  </div><!-- /qcard -->
 
  <!-- Next button -->
  <div class="bottom-bar">
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Próxima →</button>
  </div>
 
  <!-- Finish screen -->
  <div class="finish" id="finishScreen">
    <div class="finish-header">
      <h2 id="finTitle">Quiz Concluído! 🎉</h2>
      <p id="finSubtitle"></p>
    </div>
    <div class="finish-body">
      <div class="finish-score" id="finScore"></div>
      <div class="finish-pct"  id="finPct"></div>
      <div class="finish-msg"  id="finMsg"></div>
      <div class="finish-btns">
        <button class="btn-primary"   onclick="restart()">Recomeçar</button>
        <button class="btn-secondary" onclick="window.location.href='index.html'">← Início</button>
      </div>
    </div>
  </div>
 
</div><!-- /page -->
 
<script>
 
let bank      = null;
let questions = [];
let cur       = 0;
let score     = 0;
let answered  = false;
let sessionSeed = 0;
 
let optionMaps            = [];
let correctDisplayLetters = [];
 
/* ─── Colour helper ─────────────────────────────────── */
function shadeColor(hex, pct) {
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, Math.max(0, (n >> 16) + pct));
  const g = Math.min(255, Math.max(0, ((n >> 8) & 0xff) + pct));
  const b = Math.min(255, Math.max(0, (n & 0xff) + pct));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
 
function applyThemeColor(hex) {
  const color     = hex || '#1d4ed8';
  const colorDark = shadeColor(color, -35);
  document.documentElement.style.setProperty('--quiz-color',      color);
  document.documentElement.style.setProperty('--quiz-color-dark', colorDark);
}
 
/* ─── Seeded PRNG (Mulberry32) ──────────────────────── */
function makePRNG(seed) {
  let s = seed >>> 0;
  return function() {
    s += 0x6D2B79F5;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) >>> 0;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
 
/* ─── Fisher-Yates shuffle ──────────────────────────── */
function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
 
/* ─── Bootstrap ─────────────────────────────────────── */
async function boot() {
  const params   = new URLSearchParams(window.location.search);
  const bankFile = params.get('bank');
 
  if (!bankFile) {
    showError('Nenhum ficheiro de quiz especificado na URL.<br>Volta à <a href="index.html">página inicial</a>.');
    return;
  }
 
  // LOCAL: read from localStorage (imported via drag/drop on landing page)
  if (bankFile === 'local') {
    const raw = localStorage.getItem('mq_imported_bank');
    if (!raw) {
      showError('Nenhum quiz importado encontrado.<br>Volta à <a href="index.html">página inicial</a> e importa um ficheiro JSON.');
      return;
    }
    try { bank = JSON.parse(raw); }
    catch (_) {
      showError('Erro ao ler o quiz importado.<br>Volta à <a href="index.html">página inicial</a> e importa novamente.');
      return;
    }
 
  // REMOTE: fetch from data/ folder as usual
  } else {
    try {
      const res = await fetch(`data/${bankFile}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      bank = await res.json();
    } catch (e) {
      showError(`Não foi possível carregar <strong>${bankFile}</strong>.<br>${e.message}<br>Volta à <a href="index.html">página inicial</a>.`);
      return;
    }
  }
 
  if (!bank.questions || !Array.isArray(bank.questions) || !bank.questions.length) {
    showError('O ficheiro JSON não contém questões válidas.');
    return;
  }
 
  document.title = `MedQuiz — ${bank.meta?.title || 'Quiz'}`;
 
  // Apply theme colour from meta — falls back to default blue
  applyThemeColor(bank.meta?.color);
 
  initSession();
}
 
/* ─── Initialise a new randomised session ──────────── */
function initSession() {
  sessionSeed = Math.floor(Math.random() * 2 ** 32);
  const rng   = makePRNG(sessionSeed);
 
  // 1. Shuffle question order
  const indices         = bank.questions.map((_, i) => i);
  const shuffledIndices = shuffle(indices, rng);
  questions             = shuffledIndices.map(i => bank.questions[i]);
 
  // 2. For each question, shuffle options and track which display
  //    letter (A-E) maps to the correct answer
  const displayLetters  = ['A', 'B', 'C', 'D', 'E'];
  optionMaps            = [];
  correctDisplayLetters = [];
 
  questions.forEach(q => {
    const shuffledOpts = shuffle(q.options, rng);
    optionMaps.push(shuffledOpts);
 
    const correctIdx = shuffledOpts.findIndex(o => o.letter === q.correct);
    correctDisplayLetters.push(displayLetters[correctIdx] ?? q.correct);
  });
 
  cur      = 0;
  score    = 0;
  answered = false;
  render();
}
 
/* ─── Render current question ───────────────────────── */
function render() {
  const q              = questions[cur];
  const displayOpts    = optionMaps[cur];
  const displayLetters = ['A', 'B', 'C', 'D', 'E'];
 
  answered = false;
 
  // Progress
  const pct = Math.round((cur / questions.length) * 100);
  document.getElementById('progFill').style.width  = pct + '%';
  document.getElementById('progLabel').textContent = `Questão ${cur + 1} de ${questions.length}`;
  document.getElementById('progPct').textContent   = pct + '%';
  document.getElementById('scorePill').textContent = `${score} / ${cur}`;
 
  // Header
  document.getElementById('qNum').textContent    = `Q${cur + 1} / ${questions.length}`;
  document.getElementById('qDomain').textContent = q.domain ?? '';
  document.getElementById('qLevel').textContent  = q.level  ?? '';
 
  // Vignette
  const vigWrap = document.getElementById('vignetteWrap');
  if (q.vignette) {
    vigWrap.style.display = 'block';
    document.getElementById('vignetteText').textContent = q.vignette;
    document.getElementById('labTableWrap').innerHTML   = buildLabTable(q.labTable);
  } else {
    vigWrap.style.display = 'none';
  }
 
  // Question
  document.getElementById('questionText').textContent = q.question;
 
  // Options — always displayed A, B, C, D, E; text shuffled
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  displayOpts.forEach((opt, idx) => {
    const dispLetter = displayLetters[idx];
    const div = document.createElement('div');
    div.className = 'opt';
    div.dataset.dispLetter = dispLetter;
    div.dataset.origLetter = opt.letter;
    div.innerHTML = `<span class="letter">${dispLetter}</span><span>${opt.text}</span>`;
    div.addEventListener('click', () => selectAnswer(dispLetter));
    container.appendChild(div);
  });
 
  // Reset
  document.getElementById('expPanel').classList.remove('show');
  document.getElementById('btnNext').style.display = 'none';
}
 
/* ─── Answer selection ──────────────────────────────── */
function selectAnswer(chosenDisp) {
  if (answered) return;
  answered = true;
 
  const correctDisp = correctDisplayLetters[cur];
  const ok          = chosenDisp === correctDisp;
  if (ok) score++;
 
  // Colour the options
  document.querySelectorAll('.opt').forEach(el => {
    el.classList.add('disabled');
    const l = el.dataset.dispLetter;
    if      (l === correctDisp) el.classList.add('correct');
    else if (l === chosenDisp)  el.classList.add('wrong');
    else                        el.classList.add('neutral');
  });
 
  // Explanation
  const q              = questions[cur];
  const displayOpts    = optionMaps[cur];
  const displayLetters = ['A', 'B', 'C', 'D', 'E'];
 
  document.getElementById('expText').textContent   = q.explanation ?? '';
  document.getElementById('expSource').textContent = q.source ? `📚 Fonte: ${q.source}` : '';
  document.getElementById('logicText').textContent = q.logic ?? '';
 
  // Build original → display letter lookup
  const origToDisp = {};
  displayOpts.forEach((opt, idx) => { origToDisp[opt.letter] = displayLetters[idx]; });
 
  // Distractors sorted by display letter order
  const distList     = document.getElementById('distList');
  const displayOrder = ['A','B','C','D','E'];
  distList.innerHTML = '';
 
  (q.distractors ?? [])
    .filter(d => d.letter !== q.correct)
    .sort((a, b) => displayOrder.indexOf(origToDisp[a.letter]) - displayOrder.indexOf(origToDisp[b.letter]))
    .forEach(d => {
      const mappedDisp = origToDisp[d.letter] ?? d.letter;
      const div = document.createElement('div');
      div.className = 'dist-item';
      div.innerHTML = `
        <span class="dist-tag">${mappedDisp}) Incorrecta</span>
        <p>${d.text}</p>
        ${d.source ? `<p class="dist-source">📚 ${d.source}</p>` : ''}`;
      distList.appendChild(div);
    });
 
  document.getElementById('expPanel').classList.add('show');
  document.getElementById('scorePill').textContent = `${score} / ${cur + 1}`;
 
  const btn = document.getElementById('btnNext');
  btn.style.display = 'block';
  btn.textContent   = cur < questions.length - 1 ? 'Próxima →' : 'Ver Resultado';
 
  // Scroll so the Próxima button is fully visible
  setTimeout(() => {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }, 120);
}
 
/* ─── Next / finish ─────────────────────────────────── */
function nextQuestion() {
  cur++;
  if (cur >= questions.length) { showFinish(); return; }
  document.getElementById('expPanel').classList.remove('show');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
 
function showFinish() {
  document.getElementById('qcard').style.display        = 'none';
  document.getElementById('btnNext').style.display      = 'none';
  document.getElementById('finishScreen').style.display = 'block';
  document.getElementById('progFill').style.width       = '100%';
  document.getElementById('progPct').textContent        = '100%';
  document.getElementById('progLabel').textContent      = `${questions.length} de ${questions.length} questões`;
 
  const pct = Math.round((score / questions.length) * 100);
  let msg = '';
  if      (pct >= 85) msg = '🏆 Excelente! Domínio sólido do tema. Estás pronto para o exame.';
  else if (pct >= 65) msg = '👍 Bom resultado! Revê os casos onde erraste, focando nos distratores.';
  else                msg = '📖 Continua a estudar — volta ao material de estudo e refaz os casos.';
 
  document.getElementById('finTitle').textContent    = bank.meta?.title ?? 'Quiz Concluído! 🎉';
  document.getElementById('finSubtitle').textContent = bank.meta?.subtitle ?? '';
  document.getElementById('finScore').textContent    = `${score} / ${questions.length}`;
  document.getElementById('finPct').textContent      = `${pct}% de respostas correctas`;
  document.getElementById('finMsg').textContent      = msg;
 
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
 
function restart() {
  document.getElementById('finishScreen').style.display = 'none';
  document.getElementById('qcard').style.display        = 'block';
  initSession();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
 
/* ─── Helpers ───────────────────────────────────────── */
function buildLabTable(rows) {
  if (!rows || !rows.length) return '';
  const thead = `<thead><tr><th>Parâmetro</th><th>Valor</th><th>Referência</th></tr></thead>`;
  const tbody = rows.map(r =>
    `<tr><td>${r.param}</td><td>${r.value}</td><td>${r.ref ?? ''}</td></tr>`
  ).join('');
  return `<table class="lab-table">${thead}<tbody>${tbody}</tbody></table>`;
}
 
function showError(html) {
  document.getElementById('qcard').innerHTML = `
    <div style="padding:40px 24px;text-align:center;color:var(--sub)">
      <div style="font-size:2rem;margin-bottom:12px">⚠️</div>
      <p style="font-size:.92rem;line-height:1.7">${html}</p>
    </div>`;
  document.getElementById('progLabel').textContent = 'Erro ao carregar';
}
 
/* ─── Start ─────────────────────────────────────────── */
boot();
</script>
</body>
</html>
